<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ARES · Duplicate Review</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon-ares.svg">
<link rel="manifest" href="/static/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04070d">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg-0:#04070d;--bg-1:#070c16;--bg-2:#0a121f;--bg-3:#0d1726;--line-1:rgba(239,68,68,0.08);--line-2:rgba(239,68,68,0.18);--text-1:#e8f0f8;--text-2:#8ba3c0;--text-3:#4a5d78;--text-4:#2d3a4e;--blue:#6495ed;--green:#10b981;--amber:#f59e0b;--red:#ef4444;--ares:#ef4444;--ares-bright:#f87171;--zeus:#22d3ee;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;background:var(--bg-0);color:var(--text-1);font-family:"JetBrains Mono",monospace;-webkit-font-smoothing:antialiased;}
::selection{background:var(--ares);color:var(--bg-0);}
.navbar{position:sticky;top:0;z-index:100;background:rgba(4,7,13,0.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line-1);padding:14px 24px;padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;gap:20px;font-family:"Bricolage Grotesque",sans-serif;}
.navbar-left{display:flex;align-items:center;gap:16px;}
.nbr{display:inline-flex;align-items:center;gap:12px;text-decoration:none;opacity:.45;transition:opacity 0.18s,transform 0.18s;}
.nbr.is-active{opacity:1;}
.nbr:not(.is-active):hover{opacity:1;transform:translateY(-1px);}
.nbr.node-ares{color:var(--ares);}.nbr.node-zeus{color:var(--zeus);}
.nbr-mark{width:26px;height:26px;min-height:40px;display:flex;align-items:center;justify-content:center;border:1px solid currentColor;font-weight:800;font-size:14px;line-height:1;transition:box-shadow 0.18s;}
.nbr.is-active .nbr-mark{box-shadow:0 0 14px -4px currentColor;}
.nbr:hover .nbr-mark{box-shadow:0 0 14px -3px currentColor;}
.nbr-id{display:flex;align-items:baseline;gap:8px;}
.nbr-name{color:currentColor;font-weight:700;font-size:14px;letter-spacing:0.02em;}
.nbr-sep{color:var(--text-3);font-size:11px;}.nbr-tag{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--text-2);letter-spacing:0.1em;text-transform:uppercase;}
.back-chip{display:inline-flex;align-items:center;gap:6px;font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--text-2);text-decoration:none;letter-spacing:0.15em;text-transform:uppercase;padding:5px 11px;border:1px solid var(--line-2);transition:color 0.15s,border-color 0.15s,background 0.15s;}
.back-chip:hover{color:var(--ares);border-color:var(--ares);background:rgba(239,68,68,0.05);}
main{max-width:1400px;margin:0 auto;padding:28px 24px;}
.progress-bar{display:flex;align-items:center;gap:16px;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--line-1);}
.progress-label{font-family:"Bricolage Grotesque",sans-serif;font-size:20px;font-weight:700;color:var(--text-1);}
.progress-sub{font-size:11px;color:var(--text-3);letter-spacing:0.1em;text-transform:uppercase;}
.progress-count{font-size:13px;color:var(--text-2);}
.group-strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;min-height:360px;align-items:flex-start;}
.group-strip::-webkit-scrollbar{height:4px;}.group-strip::-webkit-scrollbar-track{background:var(--bg-2);}.group-strip::-webkit-scrollbar-thumb{background:var(--line-2);}
.card{flex:0 0 220px;border:2px solid var(--line-2);background:var(--bg-1);cursor:pointer;transition:border-color 0.15s,background 0.15s;position:relative;user-select:none;}
.card.keep{border-color:var(--green);}
.card.trash{border-color:var(--red);opacity:0.65;}
.card.selected{outline:2px solid var(--amber);outline-offset:2px;}
.card-thumb{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg-2);}
.card-body{padding:10px;}
.card-filename{font-size:10px;color:var(--text-1);word-break:break-all;margin-bottom:4px;}
.card-meta{font-size:9px;color:var(--text-3);line-height:1.6;}
.card-sim{position:absolute;top:6px;right:6px;background:rgba(4,7,13,0.85);font-size:9px;padding:2px 5px;border:1px solid var(--line-2);color:var(--text-2);}
.card-badge{position:absolute;top:6px;left:6px;font-size:9px;padding:2px 6px;font-weight:700;letter-spacing:0.08em;}
.badge-keep{background:var(--green);color:#000;}.badge-trash{background:var(--red);color:#fff;}
.action-bar{display:flex;gap:12px;margin-top:20px;align-items:center;flex-wrap:wrap;}
.btn{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;padding:10px 20px;border:1px solid;cursor:pointer;transition:background 0.15s,color 0.15s;background:transparent;}
.btn-apply{border-color:var(--green);color:var(--green);}.btn-apply:hover{background:var(--green);color:#000;}
.btn-skip{border-color:var(--line-2);color:var(--text-3);}.btn-skip:hover{border-color:var(--text-2);color:var(--text-2);}
.btn-all-trash{border-color:var(--red);color:var(--red);}.btn-all-trash:hover{background:var(--red);color:#fff;}
.kbd{font-size:9px;color:var(--text-4);margin-left:4px;border:1px solid var(--text-4);padding:1px 3px;}
.status-msg{font-size:11px;color:var(--text-3);margin-left:auto;}
.done-msg{text-align:center;padding:80px 0;font-family:"Bricolage Grotesque",sans-serif;font-size:22px;color:var(--text-2);}
.loading{text-align:center;padding:60px 0;font-size:12px;color:var(--text-3);}
</style>
</head>
<body>
<header class="navbar">
  <div class="navbar-left">
    <a href="/" class="nbr node-ares is-active" aria-current="page">
      <div class="nbr-mark">A</div>
      <div class="nbr-id">
        <span class="nbr-name">ARES</span>
        <span class="nbr-sep">/</span>
        <span class="nbr-tag">DUPES</span>
      </div>
    </a>
    <a href="/photos" class="back-chip">
      <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      <span>Photos</span>
    </a>
  </div>
</header>
<main>
  <div class="progress-bar">
    <div>
      <div class="progress-label" id="progress-label">Loading...</div>
      <div class="progress-sub">DUPLICATE REVIEW &middot; CLIP SIM &ge; 0.97</div>
    </div>
    <div class="progress-count" id="progress-count"></div>
  </div>
  <div id="group-container"><div class="loading">Computing similarity groups...</div></div>
  <div class="action-bar" id="action-bar" style="display:none">
    <button class="btn btn-apply" onclick="applyDecision()">Apply <span class="kbd">Enter</span></button>
    <button class="btn btn-skip" onclick="skipGroup()">Skip <span class="kbd">k</span></button>
    <button class="btn btn-all-trash" onclick="trashAllButLargest()">Trash rest <span class="kbd">t</span></button>
    <span class="status-msg" id="status-msg"></span>
  </div>
</main>
<script>
var cursor = 0;
var currentGroup = null;
var selectedIdx = 0;
var busy = false;

function fmt_size(b) {
  if (b >= 1e9) return (b/1e9).toFixed(1) + ' GB';
  if (b >= 1e6) return (b/1e6).toFixed(1) + ' MB';
  if (b >= 1e3) return (b/1e3).toFixed(0) + ' KB';
  return b + ' B';
}
function fmt_date(ts) {
  if (!ts) return '';
  var d = new Date(ts*1000);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fname(path) { return path.split('/').pop(); }

async function loadGroup() {
  if (busy) return;
  busy = true;
  document.getElementById('status-msg').textContent = '';
  try {
    var r = await fetch('/api/photos/dupes/pending?cursor=' + cursor);
    var d = await r.json();
    if (d.done) {
      document.getElementById('progress-label').textContent = 'All done';
      document.getElementById('progress-count').textContent = 'No pending groups';
      document.getElementById('group-container').innerHTML = '<div class="done-msg">No duplicate groups pending review.</div>';
      document.getElementById('action-bar').style.display = 'none';
      busy = false;
      return;
    }
    currentGroup = d;
    selectedIdx = 0;
    renderGroup(d);
    document.getElementById('progress-label').textContent = d.total_remaining + ' groups remaining';
    document.getElementById('progress-count').textContent = 'Group ' + (cursor+1);
    document.getElementById('action-bar').style.display = 'flex';
  } catch(e) {
    document.getElementById('group-container').innerHTML = '<div class="loading">Error loading group: ' + e + '</div>';
  }
  busy = false;
}

function renderGroup(d) {
  var strip = '<div class="group-strip" id="group-strip">';
  d.members.forEach(function(m, i) {
    var keep = (i === 0);
    var cls = (keep ? 'keep' : 'trash') + (i === selectedIdx ? ' selected' : '');
    var badge = keep ? '<span class="card-badge badge-keep">KEEP</span>' : '<span class="card-badge badge-trash">TRASH</span>';
    var thumb = m.thumb_hq || m.thumb || '';
    var simBadge = i > 0 ? '<span class="card-sim">' + (m.sim_to_first*100).toFixed(1) + '%</span>' : '<span class="card-sim" style="color:var(--green)">LARGEST</span>';
    var vidIcon = m.is_video ? '<span style="position:absolute;bottom:6px;left:6px;font-size:9px;background:rgba(4,7,13,0.85);padding:2px 5px;border:1px solid var(--line-2);color:var(--amber)">VIDEO</span>' : "";
    strip += '<div class="card ' + cls + '" data-idx="' + i + '" data-path="' + encodeURIComponent(m.path) + '" onclick="toggleCard(' + i + ')">';
    strip += badge + simBadge + vidIcon;
    strip += '<img class="card-thumb" src="' + thumb + '" loading="lazy" onerror="this.style.background='var(--bg-3)';this.removeAttribute('src')">';
    strip += '<div class="card-body">';
    strip += '<div class="card-filename">' + fname(m.path) + '</div>';
    strip += '<div class="card-meta">' + fmt_size(m.size) + ' &middot; ' + fmt_date(m.date) + '</div>';
    strip += '</div></div>';
  });
  strip += '</div>';
  document.getElementById('group-container').innerHTML = strip;
}

function toggleCard(idx) {
  if (!currentGroup) return;
  selectedIdx = idx;
  var m = currentGroup.members[idx];
  // Toggle: if currently trash -> keep, if keep -> trash
  // But ensure at least one is kept
  var cards = document.querySelectorAll('.card');
  var card = cards[idx];
  var isKeep = card.classList.contains('keep');
  var keepCount = document.querySelectorAll('.card.keep').length;
  if (isKeep && keepCount <= 1) return; // must keep at least one
  card.classList.toggle('keep', !isKeep);
  card.classList.toggle('trash', isKeep);
  var badge = card.querySelector('.card-badge');
  if (badge) {
    badge.className = isKeep ? 'card-badge badge-trash' : 'card-badge badge-keep';
    badge.textContent = isKeep ? 'TRASH' : 'KEEP';
  }
  // Update selection
  document.querySelectorAll('.card').forEach(function(c,i) {
    c.classList.toggle('selected', i === selectedIdx);
  });
}

function trashAllButLargest() {
  if (!currentGroup) return;
  document.querySelectorAll('.card').forEach(function(c, i) {
    c.classList.toggle('keep', i === 0);
    c.classList.toggle('trash', i !== 0);
    var badge = c.querySelector('.card-badge');
    if (badge) { badge.className = i === 0 ? 'card-badge badge-keep' : 'card-badge badge-trash'; badge.textContent = i === 0 ? 'KEEP' : 'TRASH'; }
  });
}

async function applyDecision() {
  if (!currentGroup || busy) return;
  busy = true;
  var keep = [], trash = [];
  document.querySelectorAll('.card').forEach(function(c, i) {
    var path = decodeURIComponent(c.dataset.path);
    if (c.classList.contains('keep')) keep.push(path);
    else trash.push(path);
  });
  document.getElementById('status-msg').textContent = 'Applying...';
  try {
    var r = await fetch('/api/photos/dupes/resolve', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({group_id: currentGroup.group_id, keep: keep, trash: trash})
    });
    var d = await r.json();
    if (d.status === 'ok') {
      document.getElementById('status-msg').textContent = 'Trashed ' + d.trashed;
      cursor++;
      setTimeout(loadGroup, 300);
    } else {
      document.getElementById('status-msg').textContent = 'Error: ' + (d.error || JSON.stringify(d.errors));
      busy = false;
    }
  } catch(e) {
    document.getElementById('status-msg').textContent = 'Error: ' + e;
    busy = false;
  }
}

function skipGroup() {
  if (busy) return;
  cursor++;
  loadGroup();
}

document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT') return;
  var cards = document.querySelectorAll('.card');
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.preventDefault();
    if (!cards.length) return;
    selectedIdx = e.key === 'ArrowLeft' ? Math.max(0, selectedIdx-1) : Math.min(cards.length-1, selectedIdx+1);
    cards.forEach(function(c,i){ c.classList.toggle('selected', i === selectedIdx); });
  } else if (e.key === ' ') {
    e.preventDefault();
    if (selectedIdx >= 0 && selectedIdx < cards.length) toggleCard(selectedIdx);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    applyDecision();
  } else if (e.key === 'k') {
    skipGroup();
  } else if (e.key === 't') {
    trashAllButLargest();
  } else if (e.key === 'Escape') {
    window.location.href = '/photos';
  }
});

loadGroup();
</script>
</body>
</html>
