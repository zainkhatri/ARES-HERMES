<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover">
    <title>ARES & ZEUS · Login</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon-ares.svg?v=2">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#04070d">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-0:#04070d; --bg-1:#070c16; --bg-2:#0a121f; --bg-3:#0d1726;
            --line-1:rgba(239,68,68,0.08); --line-2:rgba(239,68,68,0.18);
            --text-1:#e8f0f8; --text-2:#8ba3c0; --text-3:#4a5d78; --text-4:#2d3a4e;
            --ares:#ef4444; --ares-bright:#f87171; --red:#ef4444; --green:#10b981;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html, body {
            height:100%; background:var(--bg-0); color:var(--text-1);
            font-family:'JetBrains Mono', monospace;
            -webkit-font-smoothing:antialiased;
        }
        ::selection { background:var(--ares); color:var(--bg-0); }

        .shell {
            min-height:100dvh;
            display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            padding:32px 20px;
        }
        .card {
            width:100%; max-width:420px;
            background:var(--bg-1); border:1px solid var(--line-1);
            padding:40px 36px 32px;
            position:relative;
        }
        .card::before {
            content:''; position:absolute; left:0; top:0;
            width:3px; height:48px; background:var(--ares);
            opacity:0.7;
        }

        .brand {
            display:flex; align-items:center; gap:14px; margin-bottom:28px;
        }
        .brand-mark {
            width:32px; height:32px;
            display:flex; align-items:center; justify-content:center;
            border:1px solid var(--ares); color:var(--ares);
            font-family:'Bricolage Grotesque', sans-serif;
            font-weight:800; font-size:17px; line-height:1;
        }
        .brand-id {
            display:flex; flex-direction:column; gap:4px;
        }
        .brand-name {
            font-family:'Bricolage Grotesque', sans-serif;
            font-weight:700; font-size:18px; letter-spacing:0.02em;
            color:var(--ares); line-height:1;
        }
        .brand-tag {
            font-family:'JetBrains Mono', monospace; font-size:10px;
            color:var(--text-3); letter-spacing:0.15em; text-transform:uppercase;
        }

        .title {
            font-family:'Bricolage Grotesque', sans-serif;
            font-weight:700; font-size:32px;
            color:var(--text-1); letter-spacing:-0.025em;
            line-height:1; margin-bottom:6px;
        }
        .subtitle {
            font-family:'JetBrains Mono', monospace; font-size:11px;
            color:var(--text-3); letter-spacing:0.1em; text-transform:uppercase;
            margin-bottom:28px;
        }

        .field { margin-bottom:18px; }
        .label {
            font-family:'JetBrains Mono', monospace; font-size:10px;
            color:var(--text-3); letter-spacing:0.15em; text-transform:uppercase;
            margin-bottom:8px; display:block;
        }
        .input {
            width:100%;
            background:var(--bg-0); border:1px solid var(--line-2);
            color:var(--text-1);
            font-family:'JetBrains Mono', monospace; font-size:16px;
            padding:12px 14px; outline:none;
            transition:border-color 0.15s ease;
        }
        .input:focus { border-color:var(--ares); }

        .submit {
            width:100%;
            background:none; border:1px solid var(--ares);
            color:var(--ares);
            font-family:'JetBrains Mono', monospace; font-size:12px;
            padding:14px; margin-top:6px;
            letter-spacing:0.15em; text-transform:uppercase;
            cursor:pointer;
            transition:background 0.15s ease, color 0.15s ease;
        }
        .submit:hover { background:var(--ares); color:var(--bg-0); }
        .submit:disabled { opacity:0.5; cursor:default; }

        .error {
            display:none;
            font-family:'JetBrains Mono', monospace; font-size:11px;
            color:var(--red); margin-top:14px;
            padding:10px 12px;
            border:1px solid rgba(239,68,68,0.3);
            background:rgba(239,68,68,0.05);
            letter-spacing:0.04em;
        }
        .error.show { display:block; }

        .footer {
            text-align:center; margin-top:28px;
            font-family:'JetBrains Mono', monospace; font-size:9px;
            color:var(--text-4); letter-spacing:0.18em; text-transform:uppercase;
        }
        .sister {
            margin-top:8px;
            color:var(--text-3);
        }
        .sister a { color:var(--blue, #6495ed); text-decoration:none; transition:opacity 0.15s; }
        .sister a:hover { opacity:0.7; }
    </style>
</head>
<body>
<div class="shell">
    <div class="card">
        <div class="brand">
            <div class="brand-mark">{{ (brand_name or 'ARES')[0] }}</div>
            <div class="brand-id">
                <span class="brand-name">{{ brand_name or 'ARES' }}</span>
                <span class="brand-tag">{{ brand_tag or 'Super-NAS' }}</span>
            </div>
        </div>

        <h1 class="title">Authenticate</h1>
        <div class="subtitle">Access requires credentials</div>

        <form id="login-form" autocomplete="off">
            <div class="field">
                <label class="label" for="password">Password</label>
                <input type="password" id="password" class="input" placeholder="••••••••" required autofocus>
            </div>
            <button type="submit" class="submit" id="submit-btn">Enter</button>
            <div class="error" id="error">Invalid password</div>
        </form>

        <div class="footer">
            <div>{{ brand_name or 'ARES' }} · {{ brand_tag or 'Super-NAS' }} · v1.0</div>
            <div class="sister">Sister node · <a href="{{ sister_href or '/jump/zeus' }}">{{ sister_name or 'ZEUS' }}</a></div>
        </div>
    </div>
</div>

<script>
var form = document.getElementById('login-form');
var pwd = document.getElementById('password');
var btn = document.getElementById('submit-btn');
var err = document.getElementById('error');

form.addEventListener('submit', async function(e) {
    e.preventDefault();
    err.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Authenticating...';
    try {
        var r = await fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({password: pwd.value}),
        });
        var data = await r.json();
        if (data.success) {
            location.href = '/';
        } else {
            err.textContent = data.error || 'Authentication failed';
            err.classList.add('show');
            btn.disabled = false;
            btn.textContent = 'Enter';
            pwd.focus();
            pwd.select();
        }
    } catch(e) {
        err.textContent = 'Network error';
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Enter';
    }
});
</script>
</body>
</html>
