<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HERMES · Ventures</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#04070d">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Same chassis as breakdown — blue accent, bg-1 cards on bg-0,
           1px grid hairlines. Ventures is the third operations module so
           it inherits the same visual language as Breakdown / Drives. */
        :root {
            --bg-0:#04070d; --bg-1:#070c16; --bg-2:#0a121f; --bg-3:#0d1726;
            --line-1:rgba(100,149,237,0.08); --line-2:rgba(100,149,237,0.18);
            --text-1:#e8f0f8; --text-2:#8ba3c0; --text-3:#4a5d78; --text-4:#2d3a4e;
            --blue:#6495ed; --blue-bright:#9ab5f5; --cyan:#67e8f9;
            --ares:#ef4444;
            --green:#10b981; --amber:#f59e0b; --red:#ef4444; --magenta:#c084fc;
            --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
            --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html, body {
            min-height:100%; background:var(--bg-0); color:var(--text-1);
            font-family:'JetBrains Mono', monospace;
            -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
        }
        ::selection { background:var(--blue); color:var(--bg-0); }
        button { touch-action:manipulation; cursor:pointer; }
        a { text-decoration:none; color:inherit; }

        .app { display:flex; flex-direction:column; }

        .top-bar {
            position:sticky; top:0; z-index:50;
            background:rgba(4,7,13,0.85);
            border-bottom:1px solid var(--line-1);
            padding:14px 24px;
            padding-top:calc(14px + var(--sat));
            padding-left:calc(24px + var(--sal));
            padding-right:calc(24px + var(--sar));
            display:flex; align-items:center; justify-content:space-between; gap:16px;
            flex-shrink:0;
        }
        .brand { display:flex; align-items:center; gap:12px; transition:opacity 0.18s ease; }
        .brand-other { opacity:0.7; }
        .brand-other:hover { opacity:1; }
        .mark-ares { border-color:var(--ares) !important; color:var(--ares) !important; }
        .top-back {
            display:inline-flex; align-items:center; gap:6px;
            font-family:'JetBrains Mono', monospace; font-size:11px;
            color:var(--text-2);
            letter-spacing:0.04em; text-transform:uppercase;
            padding:5px 10px;
            border:1px solid var(--line-2);
            transition:color 0.15s, border-color 0.15s, background 0.15s;
        }
        .top-back:hover { color:var(--blue); border-color:var(--blue); background:rgba(100,149,237,0.05); }
        .brand-mark {
            width:26px; height:26px;
            display:flex; align-items:center; justify-content:center;
            border:1px solid var(--blue); color:var(--blue);
            font-family:'Bricolage Grotesque', sans-serif;
            font-weight:800; font-size:14px; line-height:1;
        }
        .brand-line { display:flex; align-items:baseline; gap:8px; }
        .brand-text {
            font-family:'Bricolage Grotesque', sans-serif;
            font-weight:700; font-size:14px; letter-spacing:0.02em;
        }
        .brand-sep { color:var(--text-3); font-size:11px; }
        .brand-tag {
            font-family:'JetBrains Mono', monospace; font-size:10px;
            color:var(--text-2); letter-spacing:0.1em; text-transform:uppercase;
        }
        .top-status {
            display:flex; align-items:center; gap:24px;
            font-family:'JetBrains Mono', monospace; font-size:11px;
            color:var(--text-2);
        }
        .top-status .stat { display:flex; gap:6px; align-items:center; }
        .top-status .stat-key { color:var(--text-3); }
        .top-status .stat-val { color:var(--text-1); font-variant-numeric:tabular-nums; }
        .refresh-btn {
            background:none; border:1px solid var(--line-2);
            color:var(--text-2); padding:5px 10px;
            font-family:'JetBrains Mono', monospace; font-size:11px;
            letter-spacing:0.04em; text-transform:uppercase;
            transition:color 0.15s, border-color 0.15s, background 0.15s;
        }
        .refresh-btn:hover { color:var(--blue); border-color:var(--blue); background:rgba(100,149,237,0.05); }

        main {
            padding:48px 32px;
            padding-left:calc(32px + var(--sal));
            padding-right:calc(32px + var(--sar));
            max-width:1480px; margin:0 auto; width:100%;
        }

        /* Page hero */
        .page-hero {
            margin-bottom:16px;
            padding-bottom:12px;
            border-bottom:1px solid var(--line-1);
        }
        .page-title {
            font-family:'Bricolage Grotesque', sans-serif;
            font-weight:800; font-size:clamp(28px, 4vw, 44px);
            color:var(--text-1);
            letter-spacing:-0.025em; line-height:1;
        }
        .page-title em { color:var(--blue); font-style:italic; font-weight:600; }
        .page-sub {
            font-family:'JetBrains Mono', monospace; font-size:11px;
            color:var(--text-3); letter-spacing:0.12em; text-transform:uppercase;
            margin-top:8px;
        }

        /* Window nav (mimics year-nav) */
        .win-nav {
            display:flex; align-items:center; justify-content:center;
            gap:14px; margin-bottom:24px;
        }
        .win-btn {
            background:var(--bg-1); border:1px solid var(--line-2);
            color:var(--text-2);
            font-family:'JetBrains Mono', monospace; font-size:11px;
            padding:8px 14px; min-height:44px;
            display:flex; align-items:center; justify-content:center;
            transition:color 0.15s, border-color 0.15s, background 0.15s;
            letter-spacing:0.08em; text-transform:uppercase;
        }
        .win-btn:hover { color:var(--blue); border-color:var(--blue); background:rgba(100,149,237,0.05); }
        .win-label {
            font-family:'Bricolage Grotesque', sans-serif;
            font-weight:700; font-size:24px; letter-spacing:-0.01em;
            color:var(--text-1);
            cursor:pointer; padding:0 12px;
        }
        .win-label:hover { color:var(--blue); }

        /* Layout */
        .layout {
            display:grid;
            grid-template-columns:1.6fr 1fr;
            gap:16px;
        }
        @media (min-width:1025px) {
            .layout {
                height:calc(100vh - 380px);
                min-height:520px;
                max-height:780px;
            }
        }
        @media (max-width:1024px) {
            .layout { grid-template-columns:1fr; }
        }

        /* Venture grid (mimics cal-grid) */
        .v-grid {
            display:grid;
            grid-template-columns:repeat(4, 1fr);
            grid-template-rows:repeat(3, 1fr);
            gap:1px;
            background:var(--line-1);
            border:1px solid var(--line-1);
            min-height:0;
        }
        @media (min-width:1025px) {
            .v-grid { height:100%; }
        }
        @media (max-width:768px) {
            .v-grid { grid-template-columns:repeat(2, 1fr); grid-template-rows:auto; }
        }
        .v-card {
            background:var(--bg-1);
            display:flex; flex-direction:column;
            transition:background 0.15s;
            min-height:0;
            cursor:pointer;
        }
        .v-card:hover { background:var(--bg-2); }
        .v-card.selected { background:var(--bg-2); outline:1px solid var(--blue); outline-offset:-1px; }
        .v-card-head {
            display:flex; justify-content:space-between; align-items:center;
            padding:14px 18px;
        }
        .v-name {
            font-family:'Bricolage Grotesque', sans-serif;
            font-weight:700; font-size:16px;
            color:var(--text-1);
            letter-spacing:0.02em;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
        }
        .v-status-dot {
            width:8px; height:8px; border-radius:50%;
            flex-shrink:0;
            background:var(--text-4);
        }
        .v-status-dot.active { background:var(--green); box-shadow:0 0 6px var(--green); }
        .v-status-dot.setup { background:var(--amber); }
        .halves {
            display:grid; grid-template-columns:1fr 1fr;
            gap:1px; background:var(--line-1);
            border-top:1px solid var(--line-1);
            flex:1;
        }
        .half {
            background:var(--bg-1);
            padding:14px 12px;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            text-align:center;
            min-height:0;
        }
        .v-card.selected .half { background:var(--bg-2); }
        .half-label {
            font-family:'JetBrains Mono', monospace; font-size:9px;
            color:var(--text-3);
            letter-spacing:0.14em; text-transform:uppercase;
            margin-bottom:8px;
        }
        .half-value {
            font-family:'Bricolage Grotesque', sans-serif;
            font-weight:600; font-size:20px;
            color:var(--blue-bright);
            font-variant-numeric:tabular-nums;
            line-height:1;
        }
        .half-value.zero { color:var(--text-4); }
        .half-value.dim { color:var(--text-3); }
        .half-meta {
            font-family:'JetBrains Mono', monospace; font-size:9px;
            color:var(--text-3);
            margin-top:6px;
            letter-spacing:0.04em;
        }

        /* Detail */
        .detail {
            background:var(--bg-1);
            border:1px solid var(--line-1);
            padding:20px 22px;
            min-height:0;
        }
        @media (min-width:1025px) {
            .detail {
                height:100%;
                overflow-y:auto;
                -webkit-overflow-scrolling:touch;
            }
            .detail::-webkit-scrollbar { width:4px; }
            .detail::-webkit-scrollbar-track { background:transparent; }
            .detail::-webkit-scrollbar-thumb { background:var(--text-4); }
        }
        @media (max-width:1024px) {
            .detail { min-height:400px; }
        }
        .detail-head {
            display:flex; justify-content:space-between; align-items:start;
            padding-bottom:14px;
            border-bottom:1px solid var(--line-1);
            margin-bottom:18px;
            gap:12px;
        }
        .detail-title {
            font-family:'Bricolage Grotesque', sans-serif;
            font-weight:700; font-size:22px;
            color:var(--text-1);
            letter-spacing:-0.01em;
            line-height:1.1;
        }
        .detail-sub {
            font-family:'JetBrains Mono', monospace;
            font-size:11px;
            color:var(--text-3);
            margin-top:6px;
            letter-spacing:0.08em;
            text-transform:uppercase;
        }
        .pill {
            font-family:'JetBrains Mono', monospace;
            font-size:9px; letter-spacing:0.1em; text-transform:uppercase;
            padding:4px 8px;
            border:1px solid var(--line-2);
            color:var(--text-2);
            background:none;
            display:inline-flex; align-items:center; gap:6px;
        }
        .pill .d { width:6px; height:6px; border-radius:50%; background:var(--text-4); }
        .pill.live { color:var(--green); border-color:rgba(16,185,129,0.3); }
        .pill.live .d { background:var(--green); box-shadow:0 0 6px var(--green); }
        .pill.setup { color:var(--amber); border-color:rgba(245,158,11,0.3); }
        .pill.setup .d { background:var(--amber); }
        .pill.idle { color:var(--text-3); }

        /* Stat cards inside detail (mimics summary-cards) */
        .summary-cards {
            display:grid; grid-template-columns:1fr 1fr;
            gap:1px; background:var(--line-1);
            border:1px solid var(--line-1);
            margin-bottom:16px;
        }
        .scard {
            background:var(--bg-1); padding:14px 16px;
        }
        .scard-key {
            font-family:'JetBrains Mono', monospace; font-size:9px;
            color:var(--text-3); letter-spacing:0.15em; text-transform:uppercase;
            margin-bottom:6px;
        }
        .scard-val {
            font-family:'Bricolage Grotesque', sans-serif;
            font-weight:600; font-size:22px;
            color:var(--text-1);
            font-variant-numeric:tabular-nums;
            line-height:1;
        }
        .scard-val.green { color:var(--green); }
        .scard-val.blue { color:var(--blue-bright); }
        .scard-val.amber { color:var(--amber); }
        .scard-val.dim { color:var(--text-4); }
        .scard-val.zero { color:var(--text-4); font-weight:500; }
        .scard-sub {
            font-family:'JetBrains Mono', monospace; font-size:9px;
            color:var(--text-3);
            margin-top:6px;
            letter-spacing:0.04em;
        }

        /* Section heads inside detail */
        .det-head {
            font-family:'JetBrains Mono', monospace; font-size:9px;
            color:var(--text-3); letter-spacing:0.15em; text-transform:uppercase;
            margin-top:18px; margin-bottom:8px;
            padding-top:14px; border-top:1px solid var(--line-1);
        }

        /* Pipeline strip in detail */
        .pipe-row {
            display:grid; grid-template-columns:1fr 1fr 1fr;
            gap:1px; background:var(--line-1);
            border:1px solid var(--line-1);
        }
        .pipe-cell { background:var(--bg-1); padding:10px; text-align:center; }
        .pipe-key { font-family:'JetBrains Mono', monospace; font-size:8px; color:var(--text-3); letter-spacing:0.15em; text-transform:uppercase; margin-bottom:4px; }
        .pipe-val { font-family:'Bricolage Grotesque', sans-serif; font-weight:600; font-size:14px; font-variant-numeric:tabular-nums; }
        .pipe-val.blue { color:var(--blue-bright); }

        /* Activity list (mimics month-list) */
        .act-row {
            display:grid;
            grid-template-columns:auto 1fr auto;
            gap:10px;
            align-items:center;
            padding:8px 0;
            border-bottom:1px solid var(--line-1);
            font-size:11px;
        }
        .act-row:last-child { border-bottom:none; }
        .act-time {
            font-family:'JetBrains Mono', monospace; font-size:9px;
            color:var(--text-4);
            letter-spacing:0.04em;
            font-variant-numeric:tabular-nums;
            text-transform:uppercase;
            min-width:54px;
        }
        .act-name {
            font-family:'Bricolage Grotesque', sans-serif; font-weight:500;
            font-size:12px; color:var(--text-1);
            letter-spacing:0.01em;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
        }
        .act-kind {
            font-family:'JetBrains Mono', monospace; font-size:8px;
            letter-spacing:0.12em; text-transform:uppercase;
            padding:2px 6px;
            border:1px solid var(--line-2);
            color:var(--text-3);
        }
        .act-kind.connect { color:var(--blue); border-color:rgba(100,149,237,0.3); }
        .act-kind.followup { color:var(--amber); border-color:rgba(245,158,11,0.3); }
        .act-kind.email { color:var(--magenta); border-color:rgba(192,132,252,0.3); }

        .empty-state {
            font-family:'JetBrains Mono', monospace; font-size:11px;
            color:var(--text-3); letter-spacing:0.12em; text-transform:uppercase;
            text-align:center; padding:40px 12px;
        }
        .empty-state code {
            text-transform:none; letter-spacing:0;
            color:var(--blue); padding:2px 6px;
            border:1px solid var(--line-2);
            background:rgba(100,149,237,0.04);
        }
    </style>
</head>
<body>

<div class="app">

<header class="top-bar">
    <div style="display:flex; align-items:center; gap:18px">
        <a href="/" class="brand">
            <span class="brand-mark" id="brand-mark">H</span>
            <div class="brand-line">
                <span class="brand-text" id="brand-text" style="color:var(--blue)">HERMES</span>
                <span class="brand-sep">/</span>
                <span class="brand-tag">Ventures</span>
            </div>
        </a>
        <a href="/" class="top-back">← Home</a>
    </div>
    <button class="refresh-btn" id="refresh-btn">↻ Refresh</button>
</header>

<main>
    <div class="page-hero">
        <h1 class="page-title">Ven<em>tures</em></h1>
        <div class="page-sub">Ibtakar Portfolio · <span id="hero-count">{{ data.ventures|length }}</span> ventures · live JSON aggregation</div>
    </div>

    <!-- Window nav: Today / Week / Month / Lifetime -->
    <nav class="win-nav">
        <button class="win-btn" data-act="prev">←</button>
        <button class="win-btn" data-win="today">TODAY</button>
        <button class="win-btn" data-win="week">WEEK</button>
        <span class="win-label" id="win-label">MONTH</span>
        <button class="win-btn" data-win="month">MONTH</button>
        <button class="win-btn" data-win="total">LIFETIME</button>
        <button class="win-btn" data-act="next">→</button>
    </nav>

    <div class="layout">
        <div class="v-grid" id="v-grid"><!-- filled by JS --></div>
        <div class="detail" id="detail"><!-- filled by JS --></div>
    </div>
</main>

</div>

<script id="venture-data" type="application/json">{{ data | tojson }}</script>

<script>
'use strict';

var DATA = JSON.parse(document.getElementById('venture-data').textContent);
var WINDOWS = ['today', 'week', 'month', 'total'];
var WINDOW_LABELS = { today: 'TODAY', week: 'THIS WEEK', month: 'THIS MONTH', total: 'LIFETIME' };
var STATE = {
    selectedId: (location.hash || '').replace('#', '') || (DATA.ventures[0] && DATA.ventures[0].id) || 'fai',
    window: localStorage.getItem('ventures.window') || 'total',
};

// Detect host so we tint correctly (HERMES=blue, ARES=red)
var HOST = (location.hostname.indexOf('100.77.42') === 0 || location.hostname === 'pve.tail3045df.ts.net') ? 'ares' : 'hermes';
if (HOST === 'ares') {
    document.documentElement.style.setProperty('--blue', '#ef4444');
    document.documentElement.style.setProperty('--blue-bright', '#f87171');
    document.documentElement.style.setProperty('--line-1', 'rgba(239,68,68,0.06)');
    document.documentElement.style.setProperty('--line-2', 'rgba(239,68,68,0.18)');
    var bm = document.getElementById('brand-mark');
    var bt = document.getElementById('brand-text');
    if (bm) bm.textContent = 'A';
    if (bt) bt.textContent = 'ARES';
}

function fmt(n) {
    if (n == null) return '—';
    if (n === 0) return '0';
    return n.toLocaleString();
}
function escapeHtml(s) {
    return (s == null ? '' : String(s))
        .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
        .replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function fmtClockTime(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    var today = new Date();
    if (d.toDateString() === today.toDateString())
        return d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
    return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

function ventureById(id) {
    return DATA.ventures.find(function(v) { return v.id === id; }) || DATA.ventures[0];
}

// ── Render the venture grid ─────────────────────────────────────────
function renderGrid() {
    var grid = document.getElementById('v-grid');
    var html = DATA.ventures.slice(0, 12).map(function(v) {
        var m = (v.metrics || {})[STATE.window] || {};
        var totalM = (v.metrics || {}).total || {};
        var dotCls = v.status === 'active' ? 'active' : (v.status === 'setup' ? 'setup' : '');
        var sel = v.id === STATE.selectedId;
        // Two halves: left = primary metric in current window, right = lifetime contacts
        var leftN = m.connects || 0;
        var leftLabel = 'Connects';
        var rightN, rightLabel;
        if (v.id === 'fai' && v.icp) {
            rightN = v.icp.total;
            rightLabel = 'Pipeline';
        } else {
            rightN = totalM.connects || 0;
            rightLabel = 'Lifetime';
        }
        return '<div class="v-card ' + (sel ? 'selected' : '') + '" data-id="' + escapeHtml(v.id) + '">'
             +   '<div class="v-card-head">'
             +     '<span class="v-name">' + escapeHtml(v.name) + '</span>'
             +     '<span class="v-status-dot ' + dotCls + '"></span>'
             +   '</div>'
             +   '<div class="halves">'
             +     '<div class="half">'
             +       '<div class="half-label">' + leftLabel + '</div>'
             +       '<div class="half-value ' + (leftN ? '' : 'zero') + '">' + fmt(leftN) + '</div>'
             +       '<div class="half-meta">' + WINDOW_LABELS[STATE.window].toLowerCase() + '</div>'
             +     '</div>'
             +     '<div class="half">'
             +       '<div class="half-label">' + rightLabel + '</div>'
             +       '<div class="half-value ' + (rightN ? '' : 'zero') + '">' + fmt(rightN) + '</div>'
             +       '<div class="half-meta">total</div>'
             +     '</div>'
             +   '</div>'
             + '</div>';
    }).join('');
    grid.innerHTML = html;
    grid.querySelectorAll('.v-card').forEach(function(el) {
        el.addEventListener('click', function() {
            STATE.selectedId = el.dataset.id;
            history.replaceState(null, '', '#' + STATE.selectedId);
            renderGrid();
            renderDetail();
        });
    });
}

// ── Render detail panel ─────────────────────────────────────────────
function renderDetail() {
    var v = ventureById(STATE.selectedId);
    var d = document.getElementById('detail');
    var m = (v.metrics || {})[STATE.window] || {};
    var totalM = (v.metrics || {}).total || {};
    var winLabel = WINDOW_LABELS[STATE.window];

    var pillCls = v.status === 'active' ? 'live' : (v.status === 'setup' ? 'setup' : 'idle');
    var pillTxt = v.status === 'active' ? 'Active' : (v.status === 'setup' ? 'Setup' : 'Idle');

    var html = '';
    html += '<div class="detail-head">'
         +    '<div>'
         +      '<div class="detail-title">' + escapeHtml(v.name) + '</div>'
         +      '<div class="detail-sub">' + escapeHtml(v.subtitle || 'Portfolio venture') + ' · ' + winLabel + '</div>'
         +    '</div>'
         +    '<span class="pill ' + pillCls + '"><span class="d"></span>' + pillTxt + '</span>'
         + '</div>';

    if (!v.available) {
        html += '<div class="empty-state">' + escapeHtml(v.reason || 'No instrumented data yet.') + '</div>';
        d.innerHTML = html;
        return;
    }

    // 6 stat cards in a 2-column grid: connects, messages, followups, sequences, emails, reply-rate
    function stat(key, label, val, sub, cls) {
        var displayVal = (val == null) ? '—' : fmt(val);
        var c = cls || (val === 0 ? 'zero' : '');
        return '<div class="scard">'
             +   '<div class="scard-key">' + escapeHtml(label) + '</div>'
             +   '<div class="scard-val ' + c + '">' + displayVal + '</div>'
             +   (sub ? '<div class="scard-sub">' + escapeHtml(sub) + '</div>' : '')
             + '</div>';
    }
    var lifeNote = STATE.window === 'total' ? '' : 'lifetime ' + fmt(totalM.connects || 0);
    var lifeSeq = STATE.window === 'total' ? '' : 'lifetime ' + fmt(totalM.email_sequences || 0);
    var lifeEm = STATE.window === 'total' ? '' : 'lifetime ' + fmt(totalM.emails_sent || 0);

    html += '<div class="summary-cards">';
    html += stat('connects', 'LinkedIn Connects', m.connects || 0, lifeNote, m.connects ? 'blue' : 'zero');
    html += stat('messages', 'Messages Sent', m.messages || 0, '', m.messages ? 'blue' : 'zero');
    html += stat('followups', 'Followups', m.followups || 0, '', m.followups ? 'amber' : 'zero');
    html += stat('sequences', 'Email Sequences', m.email_sequences || 0, lifeSeq, m.email_sequences ? 'blue' : 'zero');
    html += stat('emails', 'Emails Sent · BDR', m.emails_sent || 0, lifeEm, m.emails_sent ? 'green' : 'zero');
    var replyDisp = (m.reply_rate == null) ? null : (m.reply_rate + '%');
    var replySub = m.reply_rate == null ? 'lifetime view only' : 'estimated';
    html += '<div class="scard">'
          +   '<div class="scard-key">Reply Rate</div>'
          +   '<div class="scard-val ' + (replyDisp == null ? 'dim' : 'green') + '">' + (replyDisp == null ? '—' : replyDisp) + '</div>'
          +   '<div class="scard-sub">' + replySub + '</div>'
          + '</div>';
    html += '</div>';

    // Pipeline (FAI only — HubSpot snapshot)
    if (v.icp && v.icp.total) {
        html += '<div class="det-head">HubSpot Pipeline · snap ' + (v.icp.run_at ? v.icp.run_at.slice(0,10) : '—') + '</div>';
        html += '<div class="pipe-row">';
        html += '<div class="pipe-cell"><div class="pipe-key">Total</div><div class="pipe-val blue">' + fmt(v.icp.total) + '</div></div>';
        html += '<div class="pipe-cell"><div class="pipe-key">Customers</div><div class="pipe-val">' + fmt((v.icp.by_stage||{}).customer || 0) + '</div></div>';
        html += '<div class="pipe-cell"><div class="pipe-key">Opportunities</div><div class="pipe-val">' + fmt((v.icp.by_stage||{}).opportunity || 0) + '</div></div>';
        html += '<div class="pipe-cell"><div class="pipe-key">With Deal</div><div class="pipe-val">' + fmt(v.icp.has_deal || 0) + '</div></div>';
        html += '<div class="pipe-cell"><div class="pipe-key">Tier 1</div><div class="pipe-val">' + fmt((v.icp.by_tier||{}).tier_1 || 0) + '</div></div>';
        html += '<div class="pipe-cell"><div class="pipe-key">Tier 2</div><div class="pipe-val">' + fmt((v.icp.by_tier||{}).tier_2 || 0) + '</div></div>';
        html += '</div>';
    }

    // Activity log
    if (v.activity && v.activity.length) {
        html += '<div class="det-head">Activity · last ' + v.activity.length + '</div>';
        html += v.activity.slice(0, 12).map(function(a) {
            return '<div class="act-row">'
                 +   '<span class="act-time">' + fmtClockTime(a.ts) + '</span>'
                 +   '<span class="act-name">' + escapeHtml(a.name) + '</span>'
                 +   '<span class="act-kind ' + a.kind + '">' + a.kind + '</span>'
                 + '</div>';
        }).join('');
    } else {
        html += '<div class="det-head">Activity</div>';
        html += '<div class="empty-state">No activity logged yet.</div>';
    }

    d.innerHTML = html;
}

// ── Window nav handlers ─────────────────────────────────────────────
function setWindow(w) {
    STATE.window = w;
    localStorage.setItem('ventures.window', w);
    document.getElementById('win-label').textContent = WINDOW_LABELS[w];
    renderGrid();
    renderDetail();
}

document.querySelectorAll('.win-btn').forEach(function(b) {
    b.addEventListener('click', function() {
        if (b.dataset.win) {
            setWindow(b.dataset.win);
        } else if (b.dataset.act === 'prev' || b.dataset.act === 'next') {
            var i = WINDOWS.indexOf(STATE.window);
            i = b.dataset.act === 'prev'
                ? (i - 1 + WINDOWS.length) % WINDOWS.length
                : (i + 1) % WINDOWS.length;
            setWindow(WINDOWS[i]);
        }
    });
});

document.getElementById('refresh-btn').addEventListener('click', async function() {
    var btn = this;
    btn.disabled = true;
    btn.textContent = '↻ ...';
    try {
        var r = await fetch('/api/business/all', { cache: 'no-store' });
        if (r.status === 401) { location.href = '/login'; return; }
        if (!r.ok) throw new Error('refresh failed');
        DATA = await r.json();
        renderGrid();
        renderDetail();
    } catch (e) {} finally {
        setTimeout(function() {
            btn.disabled = false;
            btn.textContent = '↻ Refresh';
        }, 350);
    }
});

window.addEventListener('hashchange', function() {
    var id = location.hash.replace('#', '');
    if (id && id !== STATE.selectedId) {
        STATE.selectedId = id;
        renderGrid();
        renderDetail();
    }
});

// boot
document.getElementById('win-label').textContent = WINDOW_LABELS[STATE.window];
renderGrid();
renderDetail();
</script>

</body>
</html>
