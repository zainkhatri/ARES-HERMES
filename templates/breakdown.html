<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ARES & HERMES · Finance</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon-ares.svg?v=2">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#04070d">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-0:#04070d; --bg-1:#070c16; --bg-2:#0a121f; --bg-3:#0d1726;
            --line-1:rgba(239,68,68,0.08); --line-2:rgba(239,68,68,0.18);
            --text-1:#e8f0f8; --text-2:#8ba3c0; --text-3:#4a5d78; --text-4:#2d3a4e;
            --blue:#ef4444; --blue-bright:#fca5a5; --cyan:#67e8f9;
            --green:#10b981; --amber:#f59e0b; --red:#ef4444; --magenta:#c084fc;
            --pink:#f472b6; --orange:#fb923c;
            --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
            --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html, body {
            min-height:100%; background:var(--bg-0); color:var(--text-1);
            font-family:'JetBrains Mono', monospace;
            -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
        }
        ::selection { background:var(--blue); color:var(--bg-0); }
        button { touch-action:manipulation; cursor:pointer; }

        .app { display:flex; flex-direction:column; min-height:100vh; min-height:100dvh; }

        /* Top bar (matches home/drives) */
        .top-bar {
            position:sticky; top:0; z-index:50;
            background:rgba(4,7,13,0.85);
            border-bottom:1px solid var(--line-1);
            padding:14px 24px;
            padding-top:calc(14px + var(--sat));
            padding-left:calc(24px + var(--sal));
            padding-right:calc(24px + var(--sar));
            display:flex; align-items:center; justify-content:space-between; gap:16px;
            flex-shrink:0;
        }
        .brand { display:flex; align-items:center; gap:12px; }
        .top-back {
            display:inline-flex; align-items:center; gap:6px;
            font-family:'JetBrains Mono', monospace; font-size:11px;
            color:var(--text-2); text-decoration:none;
            letter-spacing:0.04em; text-transform:uppercase;
            padding:5px 10px;
            border:1px solid var(--line-2);
            transition:color 0.15s, border-color 0.15s, background 0.15s;
        }
        .top-back:hover { color:var(--blue); border-color:var(--blue); background:rgba(239,68,68,0.05); }
        .brand-mark {
            width:26px; height:26px;
            display:flex; align-items:center; justify-content:center;
            border:1px solid var(--blue); color:var(--blue);
            font-family:'Bricolage Grotesque', sans-serif;
            font-weight:800; font-size:14px; line-height:1;
        }
        .brand-line { display:flex; align-items:baseline; gap:8px; }
        .brand-text {
            font-family:'Bricolage Grotesque', sans-serif;
            font-weight:700; font-size:14px; letter-spacing:0.02em;
        }
        .brand-sep { color:var(--text-3); font-size:11px; }
        .brand-tag {
            font-family:'JetBrains Mono', monospace; font-size:10px;
            color:var(--text-2); letter-spacing:0.1em; text-transform:uppercase;
        }
        .top-status {
            display:flex; align-items:center; gap:24px;
            font-family:'JetBrains Mono', monospace; font-size:11px;
            color:var(--text-2);
        }
        .top-status .stat { display:flex; gap:6px; align-items:center; }
        .top-status .stat-key { color:var(--text-3); }
        .top-status .stat-val { color:var(--text-1); font-variant-numeric:tabular-nums; }

        main {
            flex:1;
            padding:48px 32px;
            padding-left:calc(32px + var(--sal));
            padding-right:calc(32px + var(--sar));
            max-width:1480px; margin:0 auto; width:100%;
        }

        /* Page hero */
        .page-hero {
            display:grid; grid-template-columns:1fr auto;
            gap:48px; align-items:end;
            margin-bottom:32px;
            padding-bottom:24px;
            border-bottom:1px solid var(--line-1);
        }
        .page-mark {
            display:inline-flex; align-items:center;
            font-family:'JetBrains Mono', monospace;
            font-weight:700;
            font-size:clamp(5px, 1.05vw, 11px);
            line-height:1.1; letter-spacing:0;
        }
        .page-mark pre { font-family:inherit; font-size:inherit; line-height:inherit; margin:0; color:var(--blue); }
        .page-sub {
            font-family:'JetBrains Mono', monospace; font-size:11px;
            color:var(--text-3); letter-spacing:0.1em; text-transform:uppercase;
            margin-top:14px;
        }
        .page-meta {
            font-family:'JetBrains Mono', monospace; font-size:11px;
            color:var(--text-3); letter-spacing:0.08em; text-transform:uppercase;
            text-align:right; line-height:1.7;
        }
        .page-meta strong {
            color:var(--text-1); font-weight:400;
            font-variant-numeric:tabular-nums;
        }

        /* Year nav */
        .year-nav {
            display:flex; align-items:center; justify-content:center;
            gap:14px; margin-bottom:24px;
        }
        .year-btn {
            background:var(--bg-1); border:1px solid var(--line-2);
            color:var(--text-2);
            font-family:'JetBrains Mono', monospace; font-size:11px;
            padding:8px 14px; min-width:44px; min-height:44px;
            display:flex; align-items:center; justify-content:center;
            transition:color 0.15s, border-color 0.15s, background 0.15s;
        }
        .year-btn:hover { color:var(--blue); border-color:var(--blue); background:rgba(239,68,68,0.05); }
        .year-label {
            font-family:'Bricolage Grotesque', sans-serif;
            font-weight:700; font-size:24px; letter-spacing:-0.01em;
            color:var(--text-1);
            cursor:pointer; padding:0 12px;
            font-variant-numeric:tabular-nums;
        }
        .year-label:hover { color:var(--blue); }

        /* Layout */
        .layout {
            display:grid;
            grid-template-columns:1fr 380px;
            gap:16px;
            align-items:start;
        }
        @media (max-width:1024px) {
            .layout { grid-template-columns:1fr; }
        }

        /* Calendar grid */
        .cal-grid {
            display:grid;
            grid-template-columns:repeat(4, 1fr);
            gap:1px;
            background:var(--line-1);
            border:1px solid var(--line-1);
        }
        @media (max-width:768px) {
            .cal-grid { grid-template-columns:repeat(2, 1fr); }
        }
        .month {
            background:var(--bg-1);
            display:flex; flex-direction:column;
            transition:background 0.15s;
        }
        .month.selected { background:var(--bg-2); outline:1px solid var(--blue); outline-offset:-1px; }
        .month-head {
            display:flex; justify-content:space-between; align-items:center;
            padding:10px 14px;
            cursor:pointer;
            transition:background 0.1s;
        }
        .month-head:hover { background:var(--bg-2); }
        .month-name {
            font-family:'Bricolage Grotesque', sans-serif;
            font-weight:600; font-size:13px;
            color:var(--text-1);
            letter-spacing:0.02em;
        }
        .month-total {
            font-family:'JetBrains Mono', monospace; font-size:11px;
            color:var(--text-3);
            font-variant-numeric:tabular-nums;
        }
        .month-total.has { color:var(--green); }
        .halves {
            display:grid; grid-template-columns:1fr 1fr;
            gap:1px; background:var(--line-1);
            border-top:1px solid var(--line-1);
            flex:1;
        }
        .half {
            background:var(--bg-1);
            padding:10px 12px;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            text-align:center;
            cursor:pointer;
            min-height:64px;
            transition:background 0.1s;
        }
        .half:hover { background:var(--bg-2); }
        .half-label {
            font-family:'JetBrains Mono', monospace; font-size:9px;
            color:var(--text-3);
            letter-spacing:0.12em; text-transform:uppercase;
            margin-bottom:4px;
        }
        .half-value {
            font-family:'Bricolage Grotesque', sans-serif;
            font-weight:600; font-size:14px;
            color:var(--blue-bright);
            font-variant-numeric:tabular-nums;
            line-height:1;
        }
        .half-meta {
            font-family:'JetBrains Mono', monospace; font-size:8px;
            color:var(--text-3);
            margin-top:3px;
            letter-spacing:0.04em;
        }
        .half-meta .acc { color:var(--blue); }

        /* Detail panel */
        .detail {
            background:var(--bg-1);
            border:1px solid var(--line-1);
            padding:20px 22px;
            min-height:400px;
        }
        .detail-head {
            display:flex; justify-content:space-between; align-items:start;
            padding-bottom:14px;
            border-bottom:1px solid var(--line-1);
            margin-bottom:18px;
            gap:12px;
        }
        .detail-title {
            font-family:'Bricolage Grotesque', sans-serif;
            font-weight:700; font-size:20px;
            color:var(--text-1);
            letter-spacing:-0.01em;
            line-height:1.1;
        }
        .detail-amount {
            font-family:'JetBrains Mono', monospace;
            font-size:14px;
            color:var(--blue-bright);
            margin-top:6px;
            font-variant-numeric:tabular-nums;
        }
        .detail-amount .of { color:var(--text-3); font-size:11px; }
        .detail-actions { display:flex; gap:6px; flex-shrink:0; }
        .pill {
            font-family:'JetBrains Mono', monospace;
            font-size:9px; letter-spacing:0.1em; text-transform:uppercase;
            padding:4px 8px;
            border:1px solid var(--line-2);
            color:var(--text-2);
            background:none;
            transition:color 0.15s, border-color 0.15s;
        }
        .pill:hover { color:var(--text-1); border-color:var(--text-2); }
        .pill.danger:hover { color:var(--red); border-color:var(--red); }
        .pill.primary { color:var(--blue); border-color:rgba(239,68,68,0.3); }
        .pill.primary:hover { background:rgba(239,68,68,0.05); }
        .pill.grade-best { color:var(--green); border-color:rgba(16,185,129,0.3); }
        .pill.grade-mid { color:var(--amber); border-color:rgba(245,158,11,0.3); }
        .pill.grade-worst { color:var(--red); border-color:rgba(239,68,68,0.3); }

        .meta-row {
            font-family:'JetBrains Mono', monospace; font-size:10px;
            color:var(--text-3); letter-spacing:0.04em; text-transform:uppercase;
            margin-bottom:14px;
        }
        .meta-row .acc { color:var(--blue); }

        .empty-state {
            font-family:'JetBrains Mono', monospace; font-size:11px;
            color:var(--text-3); letter-spacing:0.12em; text-transform:uppercase;
            text-align:center; padding:40px 12px;
        }

        /* Year overview cards */
        .summary-cards {
            display:grid; grid-template-columns:1fr 1fr;
            gap:1px; background:var(--line-1);
            border:1px solid var(--line-1);
            margin-bottom:16px;
        }
        .scard {
            background:var(--bg-1); padding:14px 16px;
        }
        .scard-key {
            font-family:'JetBrains Mono', monospace; font-size:9px;
            color:var(--text-3); letter-spacing:0.15em; text-transform:uppercase;
            margin-bottom:6px;
        }
        .scard-val {
            font-family:'Bricolage Grotesque', sans-serif;
            font-weight:600; font-size:18px;
            color:var(--text-1);
            font-variant-numeric:tabular-nums;
        }
        .scard-val.green { color:var(--green); }
        .scard-val.blue { color:var(--blue-bright); }

        /* Income chart */
        .chart {
            margin-bottom:18px; padding-bottom:16px;
            border-bottom:1px solid var(--line-1);
        }
        .chart-head {
            display:flex; justify-content:space-between; align-items:center;
            margin-bottom:10px;
            font-family:'JetBrains Mono', monospace; font-size:9px;
            color:var(--text-3); letter-spacing:0.15em; text-transform:uppercase;
        }
        .chart-bars {
            display:flex; align-items:flex-end; gap:3px;
            height:80px;
        }
        .bar-col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; cursor:pointer; }
        .bar-stack { width:100%; display:flex; flex-direction:column; justify-content:flex-end; overflow:hidden; }
        .bar-stack .ai { background:var(--blue); }
        .bar-stack .id { background:var(--magenta); }
        .bar-empty { width:100%; height:1px; background:var(--text-4); }
        .bar-label { font-family:'JetBrains Mono', monospace; font-size:8px; color:var(--text-3); margin-top:6px; text-transform:uppercase; letter-spacing:0.05em; }
        .chart-legend { display:flex; gap:14px; margin-top:10px; }
        .chart-legend > div { display:flex; align-items:center; gap:5px; font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--text-3); letter-spacing:0.08em; text-transform:uppercase; }
        .chart-legend .dot { width:8px; height:8px; }
        .chart-legend .ai { background:var(--blue); }
        .chart-legend .id { background:var(--magenta); }

        /* IDL stats */
        .idl-stats {
            display:grid; grid-template-columns:1fr 1fr 1fr;
            gap:1px; background:var(--line-1);
            border:1px solid var(--line-1);
            margin-bottom:18px;
        }
        .idl-stat { background:var(--bg-1); padding:10px; text-align:center; }
        .idl-stat-key { font-family:'JetBrains Mono', monospace; font-size:8px; color:var(--text-3); letter-spacing:0.15em; text-transform:uppercase; margin-bottom:4px; }
        .idl-stat-val { font-family:'Bricolage Grotesque', sans-serif; font-weight:600; font-size:14px; font-variant-numeric:tabular-nums; }
        .idl-stat-val.green { color:var(--green); }
        .idl-stat-val.amber { color:var(--amber); }
        .idl-stat-val.red { color:var(--red); }

        /* Month list */
        .month-list-head {
            font-family:'JetBrains Mono', monospace; font-size:9px;
            color:var(--text-3); letter-spacing:0.15em; text-transform:uppercase;
            margin-bottom:10px;
        }
        .month-list-row {
            display:flex; justify-content:space-between; align-items:center;
            padding:8px 0;
            border-bottom:1px solid var(--line-1);
            cursor:pointer;
            transition:padding-left 0.15s;
        }
        .month-list-row:hover { padding-left:6px; }
        .ml-name { font-family:'Bricolage Grotesque', sans-serif; font-weight:600; font-size:13px; color:var(--text-1); letter-spacing:0.02em; }
        .ml-grade { font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:0.1em; text-transform:uppercase; }
        .ml-grade.best { color:var(--green); }
        .ml-grade.mid { color:var(--amber); }
        .ml-grade.worst { color:var(--red); }
        .ml-amount { font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--text-1); font-weight:500; font-variant-numeric:tabular-nums; }
        .ml-idl { font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--magenta); margin-right:10px; font-variant-numeric:tabular-nums; }

        /* Donut + alloc */
        .donut-wrap {
            display:flex; align-items:center; gap:18px; margin-bottom:14px; flex-wrap:wrap;
        }
        .donut {
            position:relative; width:120px; height:120px; flex-shrink:0;
        }
        .donut-center {
            position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            text-align:center;
        }
        .donut-amount { font-family:'Bricolage Grotesque', sans-serif; font-weight:600; font-size:14px; color:var(--text-1); font-variant-numeric:tabular-nums; }
        .donut-label { font-family:'JetBrains Mono', monospace; font-size:8px; color:var(--text-3); letter-spacing:0.15em; text-transform:uppercase; margin-top:2px; }
        .alloc-list { flex:1; min-width:140px; }
        .alloc-row {
            display:grid; grid-template-columns:8px 1fr auto; gap:8px;
            align-items:center;
            padding:6px 0;
            border-bottom:1px solid var(--line-1);
        }
        .alloc-row:last-child { border-bottom:none; }
        .alloc-dot { width:6px; height:6px; border-radius:50%; }
        .alloc-name { font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.04em; text-transform:uppercase; }
        .alloc-val { font-family:'JetBrains Mono', monospace; font-size:12px; font-variant-numeric:tabular-nums; }

        /* Where to send */
        .send-head {
            font-family:'JetBrains Mono', monospace; font-size:9px;
            color:var(--text-3); letter-spacing:0.15em; text-transform:uppercase;
            margin-top:14px; margin-bottom:8px;
            padding-top:14px; border-top:1px solid var(--line-1);
        }
        .send-row {
            display:flex; justify-content:space-between; align-items:center;
            padding:10px 0;
            border-bottom:1px solid var(--line-1);
        }
        .send-row:last-child { border-bottom:none; }
        .send-name { font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.05em; text-transform:uppercase; }
        .send-val { font-family:'Bricolage Grotesque', sans-serif; font-weight:600; font-size:18px; font-variant-numeric:tabular-nums; }
        .adj { display:flex; align-items:center; gap:6px; }
        .adj-btn {
            width:32px; height:32px; display:flex; align-items:center; justify-content:center;
            background:none; border:1px solid var(--line-2); color:var(--text-2);
            font-family:'JetBrains Mono', monospace; font-size:14px;
            transition:color 0.15s, border-color 0.15s, background 0.15s;
        }
        .adj-btn:hover { background:rgba(239,68,68,0.05); }
        .adj .send-val { min-width:64px; text-align:center; font-size:14px; }

        /* Predictions */
        .pred-head {
            font-family:'JetBrains Mono', monospace; font-size:9px;
            color:var(--text-3); letter-spacing:0.15em; text-transform:uppercase;
            margin-top:14px; margin-bottom:8px;
            padding-top:14px; border-top:1px solid var(--line-1);
        }
        .pred-meta {
            font-family:'JetBrains Mono', monospace; font-size:9px;
            color:var(--text-3); margin-bottom:8px;
            letter-spacing:0.04em; text-transform:uppercase;
        }
        .pred-row {
            display:flex; align-items:center; gap:10px;
            padding:6px 0;
        }
        .pred-label { font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; font-weight:600; width:48px; flex-shrink:0; }
        .pred-desc { flex:1; font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--text-3); letter-spacing:0.04em; text-transform:uppercase; }
        .pred-amount { font-family:'JetBrains Mono', monospace; font-size:12px; font-weight:600; font-variant-numeric:tabular-nums; }
        .pred-row.best .pred-label, .pred-row.best .pred-amount { color:var(--green); }
        .pred-row.mid .pred-label, .pred-row.mid .pred-amount { color:var(--amber); }
        .pred-row.worst .pred-label, .pred-row.worst .pred-amount { color:var(--red); }

        /* Investments */
        .inv-head {
            display:flex; justify-content:space-between; align-items:center;
            margin-top:18px; margin-bottom:10px;
            padding-top:14px; border-top:1px solid var(--line-1);
        }
        .inv-title {
            font-family:'JetBrains Mono', monospace; font-size:9px;
            color:var(--text-3); letter-spacing:0.15em; text-transform:uppercase;
        }
        .inv-row {
            display:flex; justify-content:space-between; align-items:center;
            padding:8px 0;
            border-bottom:1px solid var(--line-1);
        }
        .inv-ticker { font-family:'Bricolage Grotesque', sans-serif; font-weight:600; font-size:13px; color:var(--blue-bright); letter-spacing:0.04em; }
        .inv-shares { font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--text-3); margin-left:6px; letter-spacing:0.04em; text-transform:uppercase; }
        .inv-rm { font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--text-4); margin-left:4px; transition:color 0.15s; cursor:pointer; background:none; border:none; }
        .inv-rm:hover { color:var(--red); }
        .inv-now { font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--text-3); margin-top:2px; }
        .inv-value { font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--text-1); font-weight:500; font-variant-numeric:tabular-nums; }
        .inv-gain { font-family:'JetBrains Mono', monospace; font-size:9px; font-weight:600; font-variant-numeric:tabular-nums; }
        .inv-gain.up { color:var(--green); }
        .inv-gain.down { color:var(--red); }
        .inv-total {
            display:flex; justify-content:space-between; align-items:center;
            padding-top:10px; margin-top:4px;
            border-top:1px solid var(--line-1);
        }

        /* Modal */
        .modal {
            display:none; position:fixed; inset:0; z-index:100;
            background:rgba(4,7,13,0.85);
            align-items:center; justify-content:center; padding:20px;
        }
        .modal.show { display:flex; }
        .modal-box {
            background:var(--bg-1); border:1px solid var(--line-2);
            width:100%; max-width:380px;
        }
        .modal-head {
            padding:18px 22px; border-bottom:1px solid var(--line-1);
            font-family:'Bricolage Grotesque', sans-serif;
            font-weight:600; font-size:14px; color:var(--text-1);
            letter-spacing:0.02em;
        }

    .fx-rr { display:flex; flex-direction:column; align-items:flex-end; gap:5px; text-align:right; white-space:nowrap; }

    @keyframes fxin { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    .fx-in { opacity:0; animation:fxin .5s cubic-bezier(0.16,1,0.3,1) forwards; }
    @media (prefers-reduced-motion:reduce) { .fx-in { animation:none; opacity:1; } .fx-seg > span { transition:none; } }

    @media (max-width:1023px) {

<script>
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function pct1(v) { return (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1) + '%'; }

function tick() {
    const t = new Date().toLocaleTimeString('en-US', { hour12: false });
    const c = document.getElementById('t-clock'); if (c) c.textContent = t;
    const f = document.getElementById('f-time'); if (f) f.textContent = t;
}
tick(); setInterval(tick, 30000);
(function () { const y = document.getElementById('t-year'); if (y) y.textContent = new Date().getFullYear(); })();

const SOURCE_LABEL = { superinvestor: 'Superinvestors', momentum: 'Momentum', congress: 'Congress', analyst: 'Analyst' };
const USD0 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });

let DATA = { picks: [], sources: {}, quarter: '' };
let budget = Math.max(0, parseInt(localStorage.getItem('ep-budget') || '1000', 10) || 0);

function momChip(m) {
    if (m == null) return '';
    return `<span class="ep-chip mom ${m < 0 ? 'dn' : ''}">${pct1(m)} 3mo</span>`;
}

function allocate(picks) {
    return allocateBudget(picks, budget, { BAR: 65, GAMMA: 2, MAX_FUNDED: 10 });
}

function rowHtml(p, a) {
    const chips = [];
    if (p.heavies) chips.push(`<span class="ep-chip hh">${p.heavies} heavyweight${p.heavies > 1 ? 's' : ''}</span>`);
    if (p.congress) chips.push(`<span class="ep-chip">${p.congress} congress</span>`);
    if (p.upside != null && p.upside > 0) chips.push(`<span class="ep-chip">+${p.upside.toFixed(0)}% target</span>`);
    chips.push(momChip(p.momentum));
    const chipHtml = chips.filter(Boolean).join('');
    const firms = (p.firms || [])
        .map(f => `<span class="ep-firm${f.heavy ? ' hh' : ''}">${esc(f.name)}</span>`)
        .join(' · ');
    const reason = p.llm_reason ? `<div class="ep-reason">"${esc(p.llm_reason)}"</div>` : '';
    const dr = 'https://www.dataroma.com/m/activity.php?sym=' + encodeURIComponent(p.ticker) + '&typ=a';
    const alloc = a.funded
        ? `<div class="ep-alloc">${USD0.format(a.amount)}</div><div class="ep-alloc-u">conviction ${p.llm_score}</div>`
        : `<div class="ep-alloc off">—</div><div class="ep-alloc-u">below bar · ${p.llm_score}</div>`;
    return `<div class="ep-row${a.funded ? '' : ' off'}">
        <div class="ep-rank">${p.rank}</div>
        <div class="ep-id">
            <a class="ep-tk" href="${dr}" target="_blank" rel="noopener">${esc(p.ticker)}</a>
            <div class="ep-nm">${esc(p.name)}</div>
            ${reason}
            <div class="ep-firms">${firms || '—'}</div>
            ${chipHtml ? `<div class="ep-chips">${chipHtml}</div>` : ''}
        </div>
        <div class="ep-metrics">${alloc}
            <div class="ep-elites"><b>${p.buyers}</b> elites${p.heavies ? ` · <b>${p.heavies}</b> heavy` : ''}</div>
        </div>
        <div class="ep-bar" role="img" aria-label="Conviction ${a.barPct.toFixed(0)} of 100"><span style="width:${a.barPct.toFixed(1)}%"></span></div>
    </div>`;
}

function draw() {
    const picks = DATA.picks || [], sources = DATA.sources || {}, top = picks[0];
    document.getElementById('ep-top').textContent = top ? top.ticker : '—';
    const sub = document.getElementById('ep-topsub');
    if (top) {
        sub.className = 'fx-hero-gain up';
        const hh = top.heavies ? ` · ${top.heavies} heavyweight${top.heavies > 1 ? 's' : ''}` : '';
        sub.innerHTML = '▲ ' + top.buyers + ' elites buying' + hh + '<span class="span">top conviction</span>';
    } else {
        sub.className = 'fx-hero-gain';
        sub.innerHTML = '<span class="span">' + (DATA.error ? 'Source unavailable — try Refresh' : 'No data') + '</span>';
    }
    document.getElementById('ep-sources').innerHTML =
        `<div class="fx-hm-row"><span class="fx-hm-key">Budget</span><span class="fx-hm-val">${USD0.format(budget)}</span></div>`
        + `<div class="fx-hm-row"><span class="fx-hm-key">Scoring</span><span class="fx-hm-val ${sources.llm ? 'up' : ''}"${sources.llm ? '' : ' style="color:var(--text-4)"'}>${sources.llm ? 'LLAMA' : 'DATA-ONLY'}</span></div>`
        + Object.keys(SOURCE_LABEL).map(k => {
            const on = !!sources[k];
            return `<div class="fx-hm-row"><span class="fx-hm-key">${SOURCE_LABEL[k]}</span>`
                + `<span class="fx-hm-val ${on ? 'up' : ''}"${on ? '' : ' style="color:var(--text-4)"'}>${on ? 'ON' : '—'}</span></div>`;
        }).join('')
        + `<div class="fx-hm-row"><span class="fx-hm-key">As of</span><span class="fx-hm-val">${esc(DATA.quarter || '—')}</span></div>`;

    const allocs = allocate(picks);
    document.getElementById('ep-list').innerHTML = picks.length
        ? picks.map((p, i) => rowHtml(p, allocs[i])).join('')
        : '<div class="fx-empty">No picks available — try Refresh.</div>';
}

const budgetIn = document.getElementById('ep-budget-in');
budgetIn.value = budget;
budgetIn.addEventListener('input', () => {
    budget = Math.max(0, parseInt(budgetIn.value, 10) || 0);
    localStorage.setItem('ep-budget', String(budget));
    draw();
});

async function load(force) {
    const b = document.getElementById('ep-refresh');
    if (force) b.textContent = 'Refreshing…';
    try {
        const r = await fetch('/api/elite-picks' + (force ? '?refresh=1' : ''));
        DATA = await r.json();
        draw();
    } catch (e) {
        document.getElementById('ep-list').innerHTML = '<div class="fx-empty">Failed to load.</div>';
    }
    b.textContent = 'Refresh';
}
function refresh() { load(true); }
load(false);
</script>
</body>
</html>
