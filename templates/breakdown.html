<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ARES & NEXUS · Finance</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon-ares.svg?v=2">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#04070d">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-0:#04070d; --bg-1:#070c16; --bg-2:#0a121f; --bg-3:#0d1726;
            --line-1:rgba(239,68,68,0.08); --line-2:rgba(239,68,68,0.18);
            --text-1:#e8f0f8; --text-2:#8ba3c0; --text-3:#4a5d78; --text-4:#2d3a4e;
            --blue:#ef4444; --blue-bright:#fca5a5; --cyan:#67e8f9;
            --green:#10b981; --amber:#f59e0b; --red:#ef4444; --magenta:#c084fc;
            --pink:#f472b6; --orange:#fb923c;
            --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
            --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html, body {
            min-height:100%; background:var(--bg-0); color:var(--text-1);
            font-family:'JetBrains Mono', monospace;
            -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
        }
        ::selection { background:var(--blue); color:var(--bg-0); }
        button { touch-action:manipulation; cursor:pointer; }

        .app { display:flex; flex-direction:column; min-height:100vh; min-height:100dvh; }

        /* Top bar (matches home/drives) */
        .top-bar {
            position:sticky; top:0; z-index:50;
            background:rgba(4,7,13,0.85);
            border-bottom:1px solid var(--line-1);
            padding:14px 24px;
            padding-top:calc(14px + var(--sat));
            padding-left:calc(24px + var(--sal));
            padding-right:calc(24px + var(--sar));
            display:flex; align-items:center; justify-content:space-between; gap:16px;
            flex-shrink:0;
        }
        .brand { display:flex; align-items:center; gap:12px; }
        .top-back {
            display:inline-flex; align-items:center; gap:6px;
            font-family:'JetBrains Mono', monospace; font-size:11px;
            color:var(--text-2); text-decoration:none;
            letter-spacing:0.04em; text-transform:uppercase;
            padding:5px 10px;
            border:1px solid var(--line-2);
            transition:color 0.15s, border-color 0.15s, background 0.15s;
        }
        .top-back:hover { color:var(--blue); border-color:var(--blue); background:rgba(239,68,68,0.05); }
        .brand-mark {
            width:26px; height:26px;
            display:flex; align-items:center; justify-content:center;
            border:1px solid var(--blue); color:var(--blue);
            font-family:'Bricolage Grotesque', sans-serif;
            font-weight:800; font-size:14px; line-height:1;
        }
        .brand-line { display:flex; align-items:baseline; gap:8px; }
        .brand-text {
            font-family:'Bricolage Grotesque', sans-serif;
            font-weight:700; font-size:14px; letter-spacing:0.02em;
        }
        .brand-sep { color:var(--text-3); font-size:11px; }
        .brand-tag {
            font-family:'JetBrains Mono', monospace; font-size:10px;
            color:var(--text-2); letter-spacing:0.1em; text-transform:uppercase;
        }
        .top-status {
            display:flex; align-items:center; gap:24px;
            font-family:'JetBrains Mono', monospace; font-size:11px;
            color:var(--text-2);
        }
        .top-status .stat { display:flex; gap:6px; align-items:center; }
        .top-status .stat-key { color:var(--text-3); }
        .top-status .stat-val { color:var(--text-1); font-variant-numeric:tabular-nums; }

        main {
            flex:1;
            padding:48px 32px;
            padding-left:calc(32px + var(--sal));
            padding-right:calc(32px + var(--sar));
            max-width:1480px; margin:0 auto; width:100%;
        }

        /* Page hero */
        .page-hero {
            display:grid; grid-template-columns:1fr auto;
            gap:48px; align-items:end;
            margin-bottom:32px;
            padding-bottom:24px;
            border-bottom:1px solid var(--line-1);
        }
        .page-mark {
            display:inline-flex; align-items:center;
            font-family:'JetBrains Mono', monospace;
            font-weight:700;
            font-size:clamp(5px, 1.05vw, 11px);
            line-height:1.1; letter-spacing:0;
        }
        .page-mark pre { font-family:inherit; font-size:inherit; line-height:inherit; margin:0; color:var(--blue); }
        .page-sub {
            font-family:'JetBrains Mono', monospace; font-size:11px;
            color:var(--text-3); letter-spacing:0.1em; text-transform:uppercase;
            margin-top:14px;
        }
        .page-meta {
            font-family:'JetBrains Mono', monospace; font-size:11px;
            color:var(--text-3); letter-spacing:0.08em; text-transform:uppercase;
            text-align:right; line-height:1.7;
        }
        .page-meta strong {
            color:var(--text-1); font-weight:400;
            font-variant-numeric:tabular-nums;
        }

        /* Year nav */
        .year-nav {
            display:flex; align-items:center; justify-content:center;
            gap:14px; margin-bottom:24px;
        }
        .year-btn {
            background:var(--bg-1); border:1px solid var(--line-2);
            color:var(--text-2);
            font-family:'JetBrains Mono', monospace; font-size:11px;
            padding:8px 14px; min-width:44px; min-height:44px;
            display:flex; align-items:center; justify-content:center;
            transition:color 0.15s, border-color 0.15s, background 0.15s;
        }
        .year-btn:hover { color:var(--blue); border-color:var(--blue); background:rgba(239,68,68,0.05); }
        .year-label {
            font-family:'Bricolage Grotesque', sans-serif;
            font-weight:700; font-size:24px; letter-spacing:-0.01em;
            color:var(--text-1);
            cursor:pointer; padding:0 12px;
            font-variant-numeric:tabular-nums;
        }
        .year-label:hover { color:var(--blue); }

        /* Layout */
        .layout {
            display:grid;
            grid-template-columns:1fr 380px;
            gap:16px;
            align-items:start;
        }
        @media (max-width:1024px) {
            .layout { grid-template-columns:1fr; }
        }

        /* Calendar grid */
        .cal-grid {
            display:grid;
            grid-template-columns:repeat(4, 1fr);
            gap:1px;
            background:var(--line-1);
            border:1px solid var(--line-1);
        }
        @media (max-width:768px) {
            .cal-grid { grid-template-columns:repeat(2, 1fr); }
        }
        .month {
            background:var(--bg-1);
            display:flex; flex-direction:column;
            transition:background 0.15s;
        }
        .month.selected { background:var(--bg-2); outline:1px solid var(--blue); outline-offset:-1px; }
        .month-head {
            display:flex; justify-content:space-between; align-items:center;
            padding:10px 14px;
            cursor:pointer;
            transition:background 0.1s;
        }
        .month-head:hover { background:var(--bg-2); }
        .month-name {
            font-family:'Bricolage Grotesque', sans-serif;
            font-weight:600; font-size:13px;
            color:var(--text-1);
            letter-spacing:0.02em;
        }
        .month-total {
            font-family:'JetBrains Mono', monospace; font-size:11px;
            color:var(--text-3);
            font-variant-numeric:tabular-nums;
        }
        .month-total.has { color:var(--green); }
        .halves {
            display:grid; grid-template-columns:1fr 1fr;
            gap:1px; background:var(--line-1);
            border-top:1px solid var(--line-1);
            flex:1;
        }
        .half {
            background:var(--bg-1);
            padding:10px 12px;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            text-align:center;
            cursor:pointer;
            min-height:64px;
            transition:background 0.1s;
        }
        .half:hover { background:var(--bg-2); }
        .half-label {
            font-family:'JetBrains Mono', monospace; font-size:9px;
            color:var(--text-3);
            letter-spacing:0.12em; text-transform:uppercase;
            margin-bottom:4px;
        }
        .half-value {
            font-family:'Bricolage Grotesque', sans-serif;
            font-weight:600; font-size:14px;
            color:var(--blue-bright);
            font-variant-numeric:tabular-nums;
            line-height:1;
        }
        .half-meta {
            font-family:'JetBrains Mono', monospace; font-size:8px;
            color:var(--text-3);
            margin-top:3px;
            letter-spacing:0.04em;
        }
        .half-meta .acc { color:var(--blue); }

        /* Detail panel */
        .detail {
            background:var(--bg-1);
            border:1px solid var(--line-1);
            padding:20px 22px;
            min-height:400px;
        }
        .detail-head {
            display:flex; justify-content:space-between; align-items:start;
            padding-bottom:14px;
            border-bottom:1px solid var(--line-1);
            margin-bottom:18px;
            gap:12px;
        }
        .detail-title {
            font-family:'Bricolage Grotesque', sans-serif;
            font-weight:700; font-size:20px;
            color:var(--text-1);
            letter-spacing:-0.01em;
            line-height:1.1;
        }
        .detail-amount {
            font-family:'JetBrains Mono', monospace;
            font-size:14px;
            color:var(--blue-bright);
            margin-top:6px;
            font-variant-numeric:tabular-nums;
        }
        .detail-amount .of { color:var(--text-3); font-size:11px; }
        .detail-actions { display:flex; gap:6px; flex-shrink:0; }
        .pill {
            font-family:'JetBrains Mono', monospace;
            font-size:9px; letter-spacing:0.1em; text-transform:uppercase;
            padding:4px 8px;
            border:1px solid var(--line-2);
            color:var(--text-2);
            background:none;
            transition:color 0.15s, border-color 0.15s;
        }
        .pill:hover { color:var(--text-1); border-color:var(--text-2); }
        .pill.danger:hover { color:var(--red); border-color:var(--red); }
        .pill.primary { color:var(--blue); border-color:rgba(239,68,68,0.3); }
        .pill.primary:hover { background:rgba(239,68,68,0.05); }
        .pill.grade-best { color:var(--green); border-color:rgba(16,185,129,0.3); }
        .pill.grade-mid { color:var(--amber); border-color:rgba(245,158,11,0.3); }
        .pill.grade-worst { color:var(--red); border-color:rgba(239,68,68,0.3); }

        .meta-row {
            font-family:'JetBrains Mono', monospace; font-size:10px;
            color:var(--text-3); letter-spacing:0.04em; text-transform:uppercase;
            margin-bottom:14px;
        }
        .meta-row .acc { color:var(--blue); }

        .empty-state {
            font-family:'JetBrains Mono', monospace; font-size:11px;
            color:var(--text-3); letter-spacing:0.12em; text-transform:uppercase;
            text-align:center; padding:40px 12px;
        }

        /* Year overview cards */
        .summary-cards {
            display:grid; grid-template-columns:1fr 1fr;
            gap:1px; background:var(--line-1);
            border:1px solid var(--line-1);
            margin-bottom:16px;
        }
        .scard {
            background:var(--bg-1); padding:14px 16px;
        }
        .scard-key {
            font-family:'JetBrains Mono', monospace; font-size:9px;
            color:var(--text-3); letter-spacing:0.15em; text-transform:uppercase;
            margin-bottom:6px;
        }
        .scard-val {
            font-family:'Bricolage Grotesque', sans-serif;
            font-weight:600; font-size:18px;
            color:var(--text-1);
            font-variant-numeric:tabular-nums;
        }
        .scard-val.green { color:var(--green); }
        .scard-val.blue { color:var(--blue-bright); }

        /* Income chart */
        .chart {
            margin-bottom:18px; padding-bottom:16px;
            border-bottom:1px solid var(--line-1);
        }
        .chart-head {
            display:flex; justify-content:space-between; align-items:center;
            margin-bottom:10px;
            font-family:'JetBrains Mono', monospace; font-size:9px;
            color:var(--text-3); letter-spacing:0.15em; text-transform:uppercase;
        }
        .chart-bars {
            display:flex; align-items:flex-end; gap:3px;
            height:80px;
        }
        .bar-col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; cursor:pointer; }
        .bar-stack { width:100%; display:flex; flex-direction:column; justify-content:flex-end; overflow:hidden; }
        .bar-stack .ai { background:var(--blue); }
        .bar-stack .id { background:var(--magenta); }
        .bar-empty { width:100%; height:1px; background:var(--text-4); }
        .bar-label { font-family:'JetBrains Mono', monospace; font-size:8px; color:var(--text-3); margin-top:6px; text-transform:uppercase; letter-spacing:0.05em; }
        .chart-legend { display:flex; gap:14px; margin-top:10px; }
        .chart-legend > div { display:flex; align-items:center; gap:5px; font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--text-3); letter-spacing:0.08em; text-transform:uppercase; }
        .chart-legend .dot { width:8px; height:8px; }
        .chart-legend .ai { background:var(--blue); }
        .chart-legend .id { background:var(--magenta); }

        /* IDL stats */
        .idl-stats {
            display:grid; grid-template-columns:1fr 1fr 1fr;
            gap:1px; background:var(--line-1);
            border:1px solid var(--line-1);
            margin-bottom:18px;
        }
        .idl-stat { background:var(--bg-1); padding:10px; text-align:center; }
        .idl-stat-key { font-family:'JetBrains Mono', monospace; font-size:8px; color:var(--text-3); letter-spacing:0.15em; text-transform:uppercase; margin-bottom:4px; }
        .idl-stat-val { font-family:'Bricolage Grotesque', sans-serif; font-weight:600; font-size:14px; font-variant-numeric:tabular-nums; }
        .idl-stat-val.green { color:var(--green); }
        .idl-stat-val.amber { color:var(--amber); }
        .idl-stat-val.red { color:var(--red); }

        /* Month list */
        .month-list-head {
            font-family:'JetBrains Mono', monospace; font-size:9px;
            color:var(--text-3); letter-spacing:0.15em; text-transform:uppercase;
            margin-bottom:10px;
        }
        .month-list-row {
            display:flex; justify-content:space-between; align-items:center;
            padding:8px 0;
            border-bottom:1px solid var(--line-1);
            cursor:pointer;
            transition:padding-left 0.15s;
        }
        .month-list-row:hover { padding-left:6px; }
        .ml-name { font-family:'Bricolage Grotesque', sans-serif; font-weight:600; font-size:13px; color:var(--text-1); letter-spacing:0.02em; }
        .ml-grade { font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:0.1em; text-transform:uppercase; }
        .ml-grade.best { color:var(--green); }
        .ml-grade.mid { color:var(--amber); }
        .ml-grade.worst { color:var(--red); }
        .ml-amount { font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--text-1); font-weight:500; font-variant-numeric:tabular-nums; }
        .ml-idl { font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--magenta); margin-right:10px; font-variant-numeric:tabular-nums; }

        /* Donut + alloc */
        .donut-wrap {
            display:flex; align-items:center; gap:18px; margin-bottom:14px; flex-wrap:wrap;
        }
        .donut {
            position:relative; width:120px; height:120px; flex-shrink:0;
        }
        .donut-center {
            position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            text-align:center;
        }
        .donut-amount { font-family:'Bricolage Grotesque', sans-serif; font-weight:600; font-size:14px; color:var(--text-1); font-variant-numeric:tabular-nums; }
        .donut-label { font-family:'JetBrains Mono', monospace; font-size:8px; color:var(--text-3); letter-spacing:0.15em; text-transform:uppercase; margin-top:2px; }
        .alloc-list { flex:1; min-width:140px; }
        .alloc-row {
            display:grid; grid-template-columns:8px 1fr auto; gap:8px;
            align-items:center;
            padding:6px 0;
            border-bottom:1px solid var(--line-1);
        }
        .alloc-row:last-child { border-bottom:none; }
        .alloc-dot { width:6px; height:6px; border-radius:50%; }
        .alloc-name { font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.04em; text-transform:uppercase; }
        .alloc-val { font-family:'JetBrains Mono', monospace; font-size:12px; font-variant-numeric:tabular-nums; }

        /* Where to send */
        .send-head {
            font-family:'JetBrains Mono', monospace; font-size:9px;
            color:var(--text-3); letter-spacing:0.15em; text-transform:uppercase;
            margin-top:14px; margin-bottom:8px;
            padding-top:14px; border-top:1px solid var(--line-1);
        }
        .send-row {
            display:flex; justify-content:space-between; align-items:center;
            padding:10px 0;
            border-bottom:1px solid var(--line-1);
        }
        .send-row:last-child { border-bottom:none; }
        .send-name { font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.05em; text-transform:uppercase; }
        .send-val { font-family:'Bricolage Grotesque', sans-serif; font-weight:600; font-size:18px; font-variant-numeric:tabular-nums; }
        .adj { display:flex; align-items:center; gap:6px; }
        .adj-btn {
            width:32px; height:32px; display:flex; align-items:center; justify-content:center;
            background:none; border:1px solid var(--line-2); color:var(--text-2);
            font-family:'JetBrains Mono', monospace; font-size:14px;
            transition:color 0.15s, border-color 0.15s, background 0.15s;
        }
        .adj-btn:hover { background:rgba(239,68,68,0.05); }
        .adj .send-val { min-width:64px; text-align:center; font-size:14px; }

        /* Predictions */
        .pred-head {
            font-family:'JetBrains Mono', monospace; font-size:9px;
            color:var(--text-3); letter-spacing:0.15em; text-transform:uppercase;
            margin-top:14px; margin-bottom:8px;
            padding-top:14px; border-top:1px solid var(--line-1);
        }
        .pred-meta {
            font-family:'JetBrains Mono', monospace; font-size:9px;
            color:var(--text-3); margin-bottom:8px;
            letter-spacing:0.04em; text-transform:uppercase;
        }
        .pred-row {
            display:flex; align-items:center; gap:10px;
            padding:6px 0;
        }
        .pred-label { font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; font-weight:600; width:48px; flex-shrink:0; }
        .pred-desc { flex:1; font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--text-3); letter-spacing:0.04em; text-transform:uppercase; }
        .pred-amount { font-family:'JetBrains Mono', monospace; font-size:12px; font-weight:600; font-variant-numeric:tabular-nums; }
        .pred-row.best .pred-label, .pred-row.best .pred-amount { color:var(--green); }
        .pred-row.mid .pred-label, .pred-row.mid .pred-amount { color:var(--amber); }
        .pred-row.worst .pred-label, .pred-row.worst .pred-amount { color:var(--red); }

        /* Investments */
        .inv-head {
            display:flex; justify-content:space-between; align-items:center;
            margin-top:18px; margin-bottom:10px;
            padding-top:14px; border-top:1px solid var(--line-1);
        }
        .inv-title {
            font-family:'JetBrains Mono', monospace; font-size:9px;
            color:var(--text-3); letter-spacing:0.15em; text-transform:uppercase;
        }
        .inv-row {
            display:flex; justify-content:space-between; align-items:center;
            padding:8px 0;
            border-bottom:1px solid var(--line-1);
        }
        .inv-ticker { font-family:'Bricolage Grotesque', sans-serif; font-weight:600; font-size:13px; color:var(--blue-bright); letter-spacing:0.04em; }
        .inv-shares { font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--text-3); margin-left:6px; letter-spacing:0.04em; text-transform:uppercase; }
        .inv-rm { font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--text-4); margin-left:4px; transition:color 0.15s; cursor:pointer; background:none; border:none; }
        .inv-rm:hover { color:var(--red); }
        .inv-now { font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--text-3); margin-top:2px; }
        .inv-value { font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--text-1); font-weight:500; font-variant-numeric:tabular-nums; }
        .inv-gain { font-family:'JetBrains Mono', monospace; font-size:9px; font-weight:600; font-variant-numeric:tabular-nums; }
        .inv-gain.up { color:var(--green); }
        .inv-gain.down { color:var(--red); }
        .inv-total {
            display:flex; justify-content:space-between; align-items:center;
            padding-top:10px; margin-top:4px;
            border-top:1px solid var(--line-1);
        }

        /* Modal */
        .modal {
            display:none; position:fixed; inset:0; z-index:100;
            background:rgba(4,7,13,0.85);
            align-items:center; justify-content:center; padding:20px;
        }
        .modal.show { display:flex; }
        .modal-box {
            background:var(--bg-1); border:1px solid var(--line-2);
            width:100%; max-width:380px;
        }
        .modal-head {
            padding:18px 22px; border-bottom:1px solid var(--line-1);
            font-family:'Bricolage Grotesque', sans-serif;
            font-weight:600; font-size:14px; color:var(--text-1);
            letter-spacing:0.02em;
        }

            color:var(--text-3); letter-spacing:0.15em; text-transform:uppercase;

        .modal-btn {

            background:none; color:var(--text-2);

        /* Footer */

            font-family:'JetBrains Mono', monospace;
            font-size:10px; color:var(--text-3);
            letter-spacing:0.12em; text-transform:uppercase;
            display:flex; justify-content:space-between; flex-shrink:0;
        }

        @media (max-width:768px) {
            main { padding:32px 16px; }
            .page-mark { font-size:clamp(4px, 1.5vw, 8px); overflow:hidden; }
            .page-hero { grid-template-columns:1fr; gap:24px; align-items:start; }
            .page-meta { text-align:left; }
            .layout { gap:14px; }

        /* Sub-page navbar — matches drives/journals */
        .navbar {
            position:sticky; top:0; z-index:1000;
            background:rgba(4,7,13,0.92);
            border-bottom:1px solid var(--line-1);
            padding:14px 24px;
            padding-top:calc(14px + var(--sat));
            padding-left:calc(24px + var(--sal));
            padding-right:calc(24px + var(--sar));

        .navbar-left { display:flex; align-items:center; gap:16px; min-width:0; }

        .nbr-mark { width:26px; height:26px; flex-shrink:0; display:flex; align-items:center; justify-content:center; border:1px solid; font-family:'Bricolage Grotesque', sans-serif; font-weight:800; font-size:14px; line-height:1; }
        .nbr-mark.m-a { border-color:#ef4444; color:#ef4444; }
        .nbr-mark.m-n { border-color:#6495ed; color:#6495ed; }
        .nbr-id { display:flex; align-items:baseline; gap:8px; min-width:0; }
        .nbr-name { font-family:'Bricolage Grotesque', sans-serif; font-weight:700; font-size:14px; letter-spacing:0.02em; white-space:nowrap; }
        .nbr-name.n-a { color:#ef4444; }
        .nbr-name.n-n { color:#6495ed; }

        .back-chip { display:inline-flex; align-items:center; gap:6px; font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--text-2); text-decoration:none; letter-spacing:0.15em; text-transform:uppercase; padding:5px 11px; border:1px solid var(--line-2); transition:color 0.15s, border-color 0.15s, background 0.15s, gap 0.15s; }

    <style>
    /* Finance — built from the ARES home-page component language:
       sharp tiles, 1px grid gaps, accent stripes, segmented meter bars. */
    .fx {
        --ares:#ef4444; --ares-bright:#f87171;
        --acc-cash:#10b981; --acc-crypto:#f59e0b; --acc-eq:#6495ed;
        --up:#10b981; --down:#f87171;
        max-width:1180px; margin:0 auto;
    }
    .fx :focus-visible { outline:2px solid var(--ares); outline-offset:2px; }
    .fx-vh { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

    /* segmented level-meter bar (from .v-tile-bar) */
    .fx-seg { position:relative; overflow:hidden; background:var(--bg-3); display:flex; }
    .fx-seg > span { height:100%; }
    .fx-seg::after { content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
        background:repeating-linear-gradient(to right, transparent 0 9px, var(--bg-1) 9px 10px); }

    /* hero net-worth block (echoes .hero + .v-tile accent) */
    .fx-hero { position:relative; overflow:hidden; background:var(--bg-1); border:1px solid var(--line-2);
        padding:26px 28px; display:grid; grid-template-columns:1fr auto; gap:36px; align-items:center; margin-bottom:12px; }
    .fx-hero::before { content:''; position:absolute; left:0; top:0; right:0; height:2px; background:var(--ares); opacity:0.6; }
    .fx-hero::after { content:''; position:absolute; inset:0; pointer-events:none;
        background:radial-gradient(ellipse 90% 60% at 20% 0%, var(--ares) 0%, transparent 70%); opacity:0.05; }
    .fx-hero > * { position:relative; z-index:1; }
    .fx-hero-label { font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:var(--text-3); }
    .fx-hero-net { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:clamp(40px,8vw,66px);
        letter-spacing:-0.03em; line-height:1; color:var(--text-1); font-variant-numeric:tabular-nums; margin:12px 0 0; }
    .fx-hero-gain { margin-top:14px; font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:500; font-variant-numeric:tabular-nums; }
    .fx-hero-gain.up { color:var(--up); } .fx-hero-gain.down { color:var(--down); }
    .fx-hero-gain .span { color:var(--text-3); margin-left:8px; }
    .fx-hero-meta { border-left:1px solid var(--line-2); padding-left:32px; display:grid; gap:14px; min-width:210px; }
    .fx-hm-row { display:flex; justify-content:space-between; gap:16px; align-items:baseline; }
    .fx-hm-key { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-3); }
    .fx-hm-val { font-family:'Bricolage Grotesque',sans-serif; font-weight:600; font-size:16px; color:var(--text-1); font-variant-numeric:tabular-nums; }
    .fx-hm-val.up { color:var(--up); } .fx-hm-val.down { color:var(--down); }

    /* allocation bar */
    .fx-alloc { margin-bottom:18px; }
    .fx-alloc .fx-seg { height:10px; border:1px solid var(--line-2); }
    .fx-legend { display:flex; flex-wrap:wrap; gap:20px; margin-top:12px; }
    .fx-leg { display:flex; align-items:center; gap:8px; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-2); }
    .fx-leg .sw { width:9px; height:9px; }
    .fx-leg .lv { color:var(--text-3); font-variant-numeric:tabular-nums; }

    /* section head (from .section-head) */
    .fx-sh { display:flex; justify-content:space-between; align-items:baseline; margin:22px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line-1); }
    .fx-sh-title { font-family:'Bricolage Grotesque',sans-serif; font-weight:600; font-size:12px; letter-spacing:0.04em; text-transform:uppercase; color:var(--text-1); }
    .fx-sh-meta { font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-3); }

    /* toolbar buttons (from .year-btn) */
    .fx-tools { display:flex; gap:8px; flex-wrap:wrap; }
    .fx-btn { background:var(--bg-1); border:1px solid var(--line-2); color:var(--text-2);
        font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
        padding:0 12px; height:34px; display:inline-flex; align-items:center; transition:color .15s, border-color .15s, background .15s; }
    .fx-btn:hover { color:var(--ares); border-color:var(--ares); background:rgba(239,68,68,0.05); }

    /* account tiles (from .v-drives / .v-drive) — 3-up like the home drive
       strip; tiers down without ever leaving an empty grid cell */
    .fx-accts { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line-1); border:1px solid var(--line-1); }
    .fx-acct { background:var(--bg-1); padding:16px 18px 6px; position:relative; }
    .fx-acct::before { content:''; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--acc, var(--ares)); }
    .fx-acct-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding-bottom:10px; }
    .fx-acct-name { font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:15px; letter-spacing:-0.01em; line-height:1; color:var(--acc, var(--ares)); }
    .fx-acct-type { font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:0.15em; text-transform:uppercase; color:var(--text-3); margin-top:6px; }
    .fx-acct-val { font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:17px; color:var(--text-1); font-variant-numeric:tabular-nums; white-space:nowrap; }

    .fx-rowwrap { display:flex; align-items:center; border-top:1px solid var(--line-1); }
    .fx-row { flex:1; min-width:0; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0; background:none; border:none; text-align:left; transition:opacity .15s; }
    .fx-row:hover { opacity:0.7; }
    .fx-rl { min-width:0; display:flex; flex-direction:column; gap:5px; }
    .fx-tk { font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; color:var(--text-1); letter-spacing:0.03em; }
    .fx-tk.cash { color:var(--acc-cash); }
    .fx-rs { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-3); margin-top:4px; letter-spacing:0.02em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .fx-rr { display:flex; flex-direction:column; align-items:flex-end; gap:5px; text-align:right; white-space:nowrap; }
    .fx-rv { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-1); font-variant-numeric:tabular-nums; }
    .fx-rg { font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:500; margin-top:4px; font-variant-numeric:tabular-nums; }
    .fx-rg.up { color:var(--up); } .fx-rg.down { color:var(--down); }
    .fx-rm { flex-shrink:0; margin-left:10px; width:26px; height:26px; display:flex; align-items:center; justify-content:center; background:none; border:none; color:var(--text-4); opacity:0; transition:opacity .15s, color .15s; }
    .fx-acct:hover .fx-rm, .fx-rm:focus-visible { opacity:1; }
    .fx-rm:hover { color:var(--ares); }
    .fx-empty { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-3); text-align:center; padding:48px 12px; border:1px solid var(--line-1); }

    @keyframes fxin { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    .fx-in { opacity:0; animation:fxin .5s cubic-bezier(0.16,1,0.3,1) forwards; }
    @media (prefers-reduced-motion:reduce) { .fx-in { animation:none; opacity:1; } .fx-seg > span { transition:none; } }

    @media (max-width:1023px) {
        .fx-accts { grid-template-columns:repeat(2,1fr); }
        /* odd account count: last tile spans the full row instead of leaving a void */
        .fx-acct:last-child:nth-child(odd) { grid-column:1 / -1; }
    }
    @media (max-width:760px) {
        .fx-hero { grid-template-columns:1fr; gap:22px; padding:22px 18px; }
        .fx-hero-meta { border-left:none; padding-left:0; border-top:1px solid var(--line-2); padding-top:18px; min-width:0; }
    }
    @media (max-width:640px) {
        .fx-accts { grid-template-columns:1fr; }
        .fx-acct:last-child:nth-child(odd) { grid-column:auto; }
        /* section head with buttons stacks: title row, then a tidy 2×2 button grid with real tap targets */
        .fx-sh:has(.fx-tools) { flex-direction:column; align-items:stretch; gap:10px; }
        .fx-tools { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
        .fx-btn { height:44px; justify-content:center; }
    }
    </style>

    <main>
        <div class="fx">
            <h1 class="fx-vh">Finance</h1>

            <section class="fx-hero fx-in">

<!-- Holding Modal -->

<script>
const CRYPTO = new Set(['BTC', 'ETH', 'SOL', 'DOGE', 'ADA', 'XRP', 'LTC']);
const CLASS_COLOR = { cash: 'var(--acc-cash)', crypto: 'var(--acc-crypto)', equity: 'var(--acc-eq)' };
const CLASS_NAME = { cash: 'Cash', crypto: 'Crypto', equity: 'Equities' };
const USD0 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
const USD2 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 });

let data = { cash: [], holdings: [] };
let prices = {};
let moneyHidden = false;
let editHoldingId = null, editCashId = null;

function money(v, cents) { return moneyHidden ? '••••' : (cents ? USD2 : USD0).format(v || 0); }
function pctStr(v) { return (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1) + '%'; }
function signed(v) { return (v >= 0 ? '+' : '−') + USD0.format(Math.abs(Math.round(v))); }
function shares(n) { return n.toLocaleString('en-US', { maximumFractionDigits: n < 1 ? 8 : 3 }); }
function uid() { return (self.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'x' + Math.round(performance.now() * 1e3); }
function assetClass(h) { return CRYPTO.has(h.ticker) ? 'crypto' : 'equity'; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function tick() {
    const t = new Date().toLocaleTimeString('en-US', { hour12: false });
    const c = document.getElementById('t-clock'); if (c) c.textContent = t;
    const f = document.getElementById('f-time'); if (f) f.textContent = t;
}
tick(); setInterval(tick, 30000);
(function () { const y = document.getElementById('t-year'); if (y) y.textContent = new Date().getFullYear(); })();

function toggleMoney() {
    moneyHidden = !moneyHidden;
    document.getElementById('reveal-btn').textContent = moneyHidden ? 'Show' : 'Hide';
    render();
}

async function load() {
    try { const r = await fetch('/api/portfolio'); if (r.ok) { const j = await r.json(); data.cash = j.cash || []; data.holdings = j.holdings || []; } } catch (e) {}
}
async function save() {
    try { await fetch('/api/portfolio', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }); } catch (e) {}
}
async function fetchPrices() {
    const ts = [...new Set(data.holdings.map(h => h.ticker))];
    await Promise.all(ts.map(async t => {
        try { const r = await fetch('/api/stock-quote/' + encodeURIComponent(t)); if (r.ok) { const q = await r.json(); if (q.c) prices[t] = q; } } catch (e) {}
    }));
}

function hVal(h) { const p = prices[h.ticker]; return (p && p.c) ? h.shares * p.c : 0; }
function hCost(h) { return h.shares * (h.costBasis || 0); }
function hDay(h) { const p = prices[h.ticker]; return (p && p.c && p.dp != null) ? h.shares * p.c * (p.dp / 100) : 0; }
function groupClass(hs) {
    if (hs.some(h => assetClass(h) === 'equity')) return 'equity';
    if (hs.some(h => assetClass(h) === 'crypto')) return 'crypto';
    return 'cash';
}
function groupType(hs, cs) {
    if (hs.some(h => assetClass(h) === 'equity')) return 'Brokerage';
    if (hs.some(h => assetClass(h) === 'crypto')) return 'Crypto';
    if (cs.some(c => c.apy)) return 'Savings';
    return 'Cash';
}
function metaRow(k, v, cls) { return `<div class="fx-hm-row"><span class="fx-hm-key">${k}</span><span class="fx-hm-val ${cls || ''}">${v}</span></div>`; }

function holdingRow(h) {
    const p = prices[h.ticker], v = hVal(h), cost = hCost(h), g = v - cost;
    const gp = cost > 0 ? g / cost * 100 : 0, up = g >= 0;
    const px = (p && p.c) ? USD2.format(p.c) : '—';
    return `<div class="fx-rowwrap">
        <button class="fx-row" onclick="openHoldingModal('${h.id}')" aria-label="Edit ${esc(h.ticker)}">
            <span class="fx-rl"><span class="fx-tk">${esc(h.ticker)}</span><span class="fx-rs">${shares(h.shares)} × ${px}</span></span>
            <span class="fx-rr"><span class="fx-rv">${money(v)}</span>${cost > 0 ? `<span class="fx-rg ${up ? 'up' : 'down'}">${pctStr(gp)}</span>` : ''}</span>
        </button>
        <button class="fx-rm" onclick="removeHolding('${h.id}')" aria-label="Remove ${esc(h.ticker)}">✕</button>
    </div>`;
}
function cashRow(c) {
    const sub = c.apy ? `${c.apy}% APY · ${money((c.balance || 0) * c.apy / 100)}/yr` : 'Cash balance';
    return `<div class="fx-rowwrap">
        <button class="fx-row" onclick="openCashModal('${c.id}')" aria-label="Edit ${esc(c.name || 'cash')}">
            <span class="fx-rl"><span class="fx-tk cash">${esc(c.name || 'Cash')}</span><span class="fx-rs">${sub}</span></span>
            <span class="fx-rr"><span class="fx-rv">${money(c.balance || 0, true)}</span></span>
        </button>
        <button class="fx-rm" onclick="removeCash('${c.id}')" aria-label="Remove ${esc(c.name || 'cash')}">✕</button>
    </div>`;
}

function render() {
    let mkt = 0, cost = 0, day = 0;
    const byClass = { cash: 0, crypto: 0, equity: 0 };
    for (const h of data.holdings) { const v = hVal(h); mkt += v; cost += hCost(h); day += hDay(h); byClass[assetClass(h)] += v; }
    const cashTot = data.cash.reduce((s, c) => s + (c.balance || 0), 0);
    byClass.cash = cashTot;
    const net = mkt + cashTot, gain = mkt - cost, gp = cost > 0 ? gain / cost * 100 : 0, up = gain >= 0;
    const dayPct = (net - day) > 0 ? day / (net - day) * 100 : 0;

    document.getElementById('fx-net').textContent = money(net, true);
    const gEl = document.getElementById('fx-gain');
    gEl.className = 'fx-hero-gain ' + (up ? 'up' : 'down');
    gEl.innerHTML = (up ? '▲ ' : '▼ ') + (moneyHidden ? pctStr(gp) : signed(gain) + ' · ' + pctStr(gp)) + '<span class="span">all-time</span>';

    document.getElementById('fx-meta').innerHTML =
        metaRow('Invested', money(mkt)) +
        metaRow('Cash', money(cashTot)) +
        metaRow('Today', moneyHidden ? pctStr(dayPct) : signed(day), day >= 0 ? 'up' : 'down') +
        metaRow('Positions', String(data.holdings.length));

    const order = ['cash', 'equity', 'crypto'];
    let bar = '', legend = '';
    for (const k of order) {
        const share = net > 0 ? byClass[k] / net * 100 : 0;
        if (share <= 0) continue;
        bar += `<span style="width:${share.toFixed(2)}%;background:${CLASS_COLOR[k]}"></span>`;
        legend += `<span class="fx-leg"><span class="sw" style="background:${CLASS_COLOR[k]}"></span>${CLASS_NAME[k]}<span class="lv">${share.toFixed(0)}%</span></span>`;
    }
    document.getElementById('fx-bar').innerHTML = bar || '<span style="width:100%;background:var(--line-2)"></span>';
    document.getElementById('fx-legend').innerHTML = legend;
    document.getElementById('fx-alloc-meta').textContent = moneyHidden ? '3 classes' : `invested ${(net > 0 ? mkt / net * 100 : 0).toFixed(0)}%`;

    const insts = [];
    for (const h of data.holdings) if (!insts.includes(h.institution)) insts.push(h.institution);
    for (const c of data.cash) if (!insts.includes(c.institution)) insts.push(c.institution);
    const box = document.getElementById('accounts');
    if (!insts.length) { box.innerHTML = '<div class="fx-empty">No accounts yet — add a holding or cash balance.</div>'; return; }
    box.innerHTML = insts.map(inst => {
        const hs = data.holdings.filter(h => h.institution === inst);
        const cs = data.cash.filter(c => c.institution === inst);
        const sub = hs.reduce((s, h) => s + hVal(h), 0) + cs.reduce((s, c) => s + (c.balance || 0), 0);
        const cls = groupClass(hs);
        return `<section class="fx-acct" style="--acc:${CLASS_COLOR[cls]}">
            <div class="fx-acct-head">
                <div><div class="fx-acct-name">${esc(inst || 'Account')}</div><div class="fx-acct-type">${groupType(hs, cs)}</div></div>
                <div class="fx-acct-val">${money(sub)}</div>
            </div>
            ${hs.map(holdingRow).join('')}${cs.map(cashRow).join('')}
        </section>`;
    }).join('');
}

async function refresh() {
    const b = document.getElementById('refresh-btn'); b.textContent = 'Refreshing…';
    await fetchPrices(); render(); b.textContent = 'Refresh';
}

function openHoldingModal(id) {
    editHoldingId = id || null;
    const h = id ? data.holdings.find(x => x.id === id) : null;
    document.getElementById('holding-title').textContent = h ? 'Edit Holding' : 'Add Holding';
    document.getElementById('h-inst').value = h ? h.institution : '';
    document.getElementById('h-ticker').value = h ? h.ticker : '';
    document.getElementById('h-shares').value = h ? h.shares : '';
    document.getElementById('h-cost').value = h ? h.costBasis : '';
    document.getElementById('holding-modal').classList.add('show');
}
function closeHoldingModal() { document.getElementById('holding-modal').classList.remove('show'); }
async function saveHolding() {
    const inst = document.getElementById('h-inst').value.trim() || 'Account';
    const ticker = document.getElementById('h-ticker').value.trim().toUpperCase();
    const sh = parseFloat(document.getElementById('h-shares').value);
    const costBasis = parseFloat(document.getElementById('h-cost').value) || 0;
    if (!ticker || !(sh > 0)) return;
    if (editHoldingId) Object.assign(data.holdings.find(x => x.id === editHoldingId), { institution: inst, ticker, shares: sh, costBasis });
    else data.holdings.push({ id: uid(), institution: inst, ticker, shares: sh, costBasis });
    closeHoldingModal(); await save(); await fetchPrices(); render();
}
async function removeHolding(id) { data.holdings = data.holdings.filter(h => h.id !== id); await save(); render(); }

function openCashModal(id) {
    editCashId = id || null;
    const c = id ? data.cash.find(x => x.id === id) : null;
    document.getElementById('cash-title').textContent = c ? 'Edit Cash' : 'Add Cash';
    document.getElementById('c-inst').value = c ? c.institution : '';
    document.getElementById('c-name').value = c ? (c.name || '') : '';
    document.getElementById('c-balance').value = c ? c.balance : '';
    document.getElementById('c-apy').value = (c && c.apy) ? c.apy : '';
    document.getElementById('cash-modal').classList.add('show');
}
function closeCashModal() { document.getElementById('cash-modal').classList.remove('show'); }
async function saveCash() {
    const inst = document.getElementById('c-inst').value.trim() || 'Account';
    const name = document.getElementById('c-name').value.trim() || 'Cash';
    const balance = parseFloat(document.getElementById('c-balance').value) || 0;
    const raw = document.getElementById('c-apy').value; const apy = raw === '' ? undefined : parseFloat(raw);
    if (editCashId) {
        const c = data.cash.find(x => x.id === editCashId);
        c.institution = inst; c.name = name; c.balance = balance;
        if (apy === undefined) delete c.apy; else c.apy = apy;
    } else {
        const e = { id: uid(), institution: inst, name, balance }; if (apy !== undefined) e.apy = apy; data.cash.push(e);
    }
    closeCashModal(); await save(); render();
}
async function removeCash(id) { data.cash = data.cash.filter(c => c.id !== id); await save(); render(); }

document.getElementById('holding-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeHoldingModal(); });
document.getElementById('cash-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeCashModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeHoldingModal(); closeCashModal(); } });

(async () => {
    await load();
    render();
    await fetchPrices();
    render();
})();
</script>
</body>
</html>
