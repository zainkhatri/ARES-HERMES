<!DOCTYPE html>
<html lang="en" data-brand="ARES">
<head>
{% set page_title = "TERMINAL · ARES" %}
{% include "_hud_head.html" %}
    <link rel="stylesheet" href="/static/vendor/xterm/xterm.css">
    <script src="/static/vendor/xterm/xterm.js"></script>
    <script src="/static/vendor/xterm/xterm-addon-fit.js"></script>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover">
    <style>
    /* ponytail: token bridge — maps old shell.html var names → hud.css vars so JS-built UI still picks up colors */
    :root {
        --bg-0:var(--bg-0, #04070d); --bg-1:var(--bg-1, #070c16); --bg-2:var(--bg-2, #0a121f);
        --nav-ares:var(--ares, #ef4444); --nav-blue:#6495ed; --zeus:#22d3ee;
        --nav-line:rgba(239,68,68,0.08); --nav-line-2:rgba(239,68,68,0.18);
        --nav-text-2:var(--text-2, #8ba3c0); --nav-text-3:var(--text-3, #4a5d78);
    }

    /* Override hud-shell: terminal must be a full-DVH flex column with no scroll */
    html, body { height:100%; width:100%; overflow:hidden; }
    .hud-shell {
        height:100vh; height:100dvh;
        min-height:0;
        padding:calc(10px + var(--sat)) 10px calc(6px + var(--sab));
        gap:8px;
        overflow:hidden;
    }

    /* Terminal panel: stretches to fill remaining space */
    .term-panel {
        flex:1 1 auto;
        min-height:0;
        display:flex;
        flex-direction:column;
        overflow:hidden;
    }
    /* mod-body inside terminal panel: no padding, flex column, fills panel */
    .term-panel .mod-body {
        padding:0;
        flex:1 1 auto;
        min-height:0;
        display:flex;
        flex-direction:column;
        overflow:hidden;
    }

    /* === Session tab strip === */
    .ctl-tabs {
        flex:0 0 auto;
        display:flex; align-items:center; gap:6px;
        padding:7px 10px;
        background:var(--bg-1); border-bottom:1px solid var(--nav-line-2);
        overflow-x:auto; overflow-y:hidden;
        -webkit-overflow-scrolling:touch; scrollbar-width:none;
        font-family:'JetBrains Mono', monospace;
    }
    .ctl-tabs::-webkit-scrollbar { display:none; }
    .tab {
        display:inline-flex; align-items:center; gap:7px; flex:0 0 auto;
        min-height:34px; padding:0 12px;
        border:1px solid var(--nav-line-2); background:transparent;
        color:var(--nav-text-2); font-size:12px; font-weight:500;
        letter-spacing:0.04em; white-space:nowrap; cursor:pointer;
        touch-action:manipulation; transition:color .12s, border-color .12s, background .12s;
    }
    .tab.active { color:var(--nav-ares); border-color:var(--nav-ares); background:rgba(239,68,68,0.07); }
    .tab .x {
        display:inline-flex; align-items:center; justify-content:center;
        width:16px; height:16px; margin-right:-4px;
        color:var(--nav-text-3); font-size:13px; line-height:1;
    }
    .tab.active .x { color:var(--nav-ares); }
    .tab-add { font-size:12px; font-weight:700; padding:0 12px; letter-spacing:0.06em; }
    .tab-add .plus { font-size:15px; line-height:1; margin-right:1px; opacity:0.85; }
    .tab-add.t-ares  { color:var(--nav-ares); border-color:var(--nav-ares); }
    .tab-add.t-ares:active  { background:rgba(239,68,68,0.12); }
    .tab-add.t-zeus { color:var(--nav-blue); border-color:rgba(100,149,237,0.5); }
    .tab-add.t-zeus:active { background:rgba(100,149,237,0.12); }

    /* === xterm.js mount === */
    /* The whole UI is a flex column sized to the dynamic viewport. The viewport
       meta sets interactive-widget=resizes-content, so when the soft keyboard
       opens the *layout* viewport (and 100dvh) shrinks to the area above it — the
       terminal + accessory bar stay visible, the keybar rides just above the
       keyboard. */
    #term { flex:1 1 auto; width:100%; border:0; display:block; background:var(--bg-0); min-height:0; }
    .xterm-mount { width:100%; height:100%; }
    #term .xterm { height:100%; padding:8px 10px; }
    #term .xterm-viewport::-webkit-scrollbar { width:9px; }
    #term .xterm-viewport::-webkit-scrollbar-thumb { background:rgba(var(--ares-rgb),.28); }

    /* === Block + Claude views (same-slot as iframe) === */
    #block-view, #claude-view {
        flex: 1 1 auto;
        overflow-y: auto;
        background: var(--bg-0);
        display: none;
        flex-direction: column;
        gap: 6px;
        padding: 8px 10px;
        min-height: 0;
    }
    .block-card {
        background: var(--bg-1);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 4px;
        overflow: hidden;
        font-family: 'JetBrains Mono', monospace;
    }
    .block-cmd {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .block-cmd-empty { border-bottom: none; }
    .block-prompt { color: var(--nav-ares); font-weight: 700; font-size: 13px; flex-shrink: 0; }
    .block-cmd-text { flex: 1; color: #e2e8f0; font-size: 12px; word-break: break-all; }
    .block-exit { font-size: 10px; padding: 2px 6px; border-radius: 3px; font-weight: 700; flex-shrink: 0; }
    .exit-ok  { background: rgba(34,197,94,0.15); color: #4ade80; }
    .exit-err { background: rgba(239,68,68,0.15); color: #f87171; }
    .block-out {
        padding: 6px 10px; margin: 0;
        color: #8ba3c0; font-size: 11px;
        white-space: pre-wrap; word-break: break-all;
        max-height: 280px; overflow-y: auto;
        font-family: 'JetBrains Mono', monospace;
    }
    /* === Claude view === */
    .claude-waiting {
        color: #4a5d78; font-family: 'JetBrains Mono', monospace;
        font-size: 11px; padding: 24px; text-align: center;
    }
    .claude-user, .claude-assistant {
        background: var(--bg-1); border: 1px solid rgba(255,255,255,0.05);
        border-radius: 4px; padding: 8px 10px;
        font-family: 'JetBrains Mono', monospace;
    }
    .claude-role {
        font-size: 9px; font-weight: 700; letter-spacing: 0.12em;
        margin-bottom: 5px;
    }
    .claude-user .claude-role   { color: var(--nav-blue); }
    .claude-assistant .claude-role { color: var(--nav-ares); }
    .claude-text {
        color: #c4d4e4; font-size: 12px;
        white-space: pre-wrap; word-break: break-word; line-height: 1.55;
        font-family: 'Bricolage Grotesque', sans-serif;
    }
    .claude-user .claude-text { font-size: 11px; color: #8ba3c0; }
    .claude-tool {
        color: #4a5d78; font-size: 10px;
        font-family: 'JetBrains Mono', monospace;
        padding: 2px 4px; word-break: break-all;
    }

    /* === Accessory key/scroll bar — pinned above the soft keyboard === */
    .keybar {
        flex:0 0 auto;
        display:flex; align-items:center; gap:6px;
        padding:8px 10px;
        padding-left:calc(10px + env(safe-area-inset-left, 0px));
        padding-right:calc(10px + env(safe-area-inset-right, 0px));
        background:var(--bg-1); border-top:1px solid var(--nav-line-2);
        overflow-x:auto; overflow-y:hidden;
        -webkit-overflow-scrolling:touch; scrollbar-width:none;
        font-family:'JetBrains Mono', monospace;
    }
    .keybar::-webkit-scrollbar { display:none; }
    .key {
        flex:0 0 auto; min-width:44px; min-height:40px; padding:0 12px;
        display:inline-flex; align-items:center; justify-content:center;
        border:1px solid var(--nav-line-2); background:var(--bg-2);
        color:#ecf2fa; font-size:14px; font-weight:600; letter-spacing:0.03em;
        cursor:pointer; touch-action:manipulation; user-select:none;
        transition:background .1s, border-color .1s, color .1s;
    }
    .key:active { background:rgba(239,68,68,0.18); border-color:var(--nav-ares); color:#fff; }
    .key.warn:active { background:rgba(239,68,68,0.35); }
    .key-sep { flex:0 0 auto; width:1px; height:26px; background:var(--nav-line-2); margin:0 3px; }
    .key-lbl { flex:0 0 auto; color:var(--nav-text-3); font-size:9px; letter-spacing:0.18em; text-transform:uppercase; padding-right:2px; }
    .key-grow { flex:1 1 auto; }
    .key-kbd { color:var(--nav-text-2); }

    </style>
</head>
<body>
<div class="hud-shell">
{% with page_name='TERMINAL' %}{% include "_hud_nav.html" %}{% endwith %}

    <!-- Terminal panel: fills remaining viewport height -->
    <section class="mod c-tl c-tr c-bl c-br term-panel">
        <div class="mod-head">
            <span class="mod-title">Shell · pve</span>
            <span class="mod-meta" id="term-status">ttyd</span>
        </div>
        <div class="mod-body">
            <!-- Session tabs (= tmux windows). -->
            <div class="ctl-tabs" id="tabs">
                <button class="tab tab-add t-ares" id="tab-add-ares" title="New ARES shell"><span class="plus">+</span>ARES</button>
                <button class="tab tab-add t-zeus" id="tab-add-zeus" title="SSH into ZEUS"><span class="plus">+</span>ZEUS</button>
            </div>

            <!-- xterm.js terminal mount (Task 1). PTY wire-up in Task 2. -->
            <div id="term" class="xterm-mount"></div>
            <!-- Block view: Warp-style command cards for shell-kind windows -->
            <div id="block-view"></div>
            <!-- Claude view: chat feed for claude-kind windows -->
            <div id="claude-view"></div>

            <!-- Accessory bar: scroll + the keys a phone keyboard lacks. Sits directly above
                 the soft keyboard (it's the bottom child of the viewport-tracking .hud-shell). -->
            <div class="keybar" id="keys">
                <button class="key" id="kbd-toggle" title="Show / hide keyboard">⌨</button>
                <span class="key-sep"></span>
                <span class="key-lbl">scroll</span>
                <button class="key" data-scroll="up"     title="Scroll up">▲</button>
                <button class="key" data-scroll="down"   title="Scroll down">▼</button>
                <button class="key" data-scroll="bottom" title="Jump to bottom">⤓</button>
                <span class="key-sep"></span>
                <button class="key" data-key="Escape">esc</button>
                <button class="key" data-key="Tab">tab</button>
                <button class="key warn" data-key="C-c">^C</button>
                <button class="key" data-key="C-l">^L</button>
                <button class="key" data-key="C-r">^R</button>
                <span class="key-sep"></span>
                <span class="key-lbl">tabs</span>
                <button class="key" data-tab="new"  title="New tab">^T</button>
                <button class="key" data-tab="next" title="Next tab">^B</button>
                <button class="key warn" data-tab="close" title="Close tab">^Z</button>
                <span class="key-sep"></span>
                <button class="key" data-key="Left">←</button>
                <button class="key" data-key="Up">↑</button>
                <button class="key" data-key="Down">↓</button>
                <button class="key" data-key="Right">→</button>
                <span class="key-sep"></span>
                <button class="key" data-key="Enter">⏎</button>
                <span class="key-sep"></span>
                <button class="key key-kbd" id="kbd-copy" title="Copy pane to clipboard">copy</button>
            </div>
            <div id="img-banner" style="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
                 background:rgba(239,68,68,0.78);color:#fff;font-family:'JetBrains Mono',monospace;
                 font-size:12px;padding:7px 14px;border-radius:4px;opacity:0;transition:opacity 0.4s;
                 pointer-events:none;white-space:nowrap;z-index:999;"></div>

        </div>
    </section>
</div>

<script>
(function () {
    var onHttps = location.protocol === 'https:';
    // Over HTTPS (Tailscale): use same-origin /ctl and /shell/ paths.
    // Over HTTP (iOS app, direct LAN): use host IPs directly.
    var CTL  = onHttps ? '/ctl' : 'http://100.77.42.110:7683';
    var DASH = onHttps ? '' : 'http://192.168.20.213:8080';  // for /api/ routes
    var PTY_WS_URL = onHttps
        ? 'wss://' + location.host + '/pty-ws/'
        : 'ws://100.77.42.110:7686';

    // xterm.js terminal instance (Task 1). PTY wire-up in Task 2.
    var term = new Terminal({
        fontFamily: "'JetBrains Mono', monospace",
        fontSize: 13.5,
        lineHeight: 1.2,
        cursorBlink: true,
        cursorStyle: 'block',
        scrollback: 5000,
        allowProposedApi: true
    });
    var fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById('term'));
    try { fit.fit(); } catch (e) {}

    // Per-window kind map populated from pty_ws windows responses.
    var _windowKinds = {};   // index (int) → "shell" | "claude" | null
    var _currentView = 'raw';
    var _blockPollTimer = null;
    var _claudePollTimer = null;

    function _activeWin() {
        var w = lastWindows.find(function (w) { return w.active; });
        if (!w) return null;
        return w.index !== undefined ? w.index : w.i;
    }

    function _winKind(idx) {
        return (idx !== null && idx !== undefined) ? (_windowKinds[idx] || 'raw') : 'raw';
    }

    function _stripAnsi(s) {
        return s.replace(/\x1b\[[0-9;]*[A-Za-z]/g, '');
    }

    function _escHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    /* ── CTL API ─────────────────────────────────────────────────────── */
    function api(path, body) {
        var opts = { method: body !== undefined ? 'POST' : 'GET' };
        if (body !== undefined) {
            opts.headers = { 'Content-Type': 'application/json' };
            opts.body = JSON.stringify(body);
        }
        return fetch(CTL + path, opts).then(function (r) {
            return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status));
        });
    }

    /* ── Tab strip ──────────────────────────────────────────────────── */
    var tabsEl  = document.getElementById('tabs');
    var addAres = document.getElementById('tab-add-ares');
    var addZeus= document.getElementById('tab-add-zeus');
    var busy    = false;
    var lastWindows = [];

    function setView(kind) {
        clearInterval(_blockPollTimer);
        clearInterval(_claudePollTimer);
        _blockPollTimer = null;
        _claudePollTimer = null;
        _currentView = kind;
        var termEl   = document.getElementById('term');
        var blockEl  = document.getElementById('block-view');
        var claudeEl = document.getElementById('claude-view');
        termEl.style.display   = kind === 'raw'    ? 'block' : 'none';
        blockEl.style.display  = kind === 'shell'  ? 'flex'  : 'none';
        claudeEl.style.display = kind === 'claude' ? 'flex'  : 'none';
        if (kind === 'shell') {
            _pollBlocks();
            _blockPollTimer = setInterval(_pollBlocks, 800);
        }
        if (kind === 'claude') {
            _pollClaudelog();
            _claudePollTimer = setInterval(_pollClaudelog, 1000);
        }
    }

    var ws = null;
    var _wsRetry = 0;
    function wsSend(s) {                                  // input MUST be binary frames
        if (ws && ws.readyState === 1) ws.send(new TextEncoder().encode(s));
    }
    function connectPty() {
        ws = new WebSocket(PTY_WS_URL);
        ws.binaryType = 'arraybuffer';                    // so PTY output arrives as ArrayBuffer
        ws.onopen = function () {
            _wsRetry = 0;
            ws.send(JSON.stringify({ open: 'web' }));     // attach tmux session "web"
            try { fit.fit(); ws.send(JSON.stringify({ cols: term.cols, rows: term.rows })); } catch (e) {}
            term.focus();
        };
        ws.onmessage = function (ev) {
            if (typeof ev.data === 'string') {            // control JSON (e.g. {windows:[...]})
                try { var d = JSON.parse(ev.data); if (d.windows) renderTabs(d.windows); } catch (e) {}
            } else {
                term.write(new Uint8Array(ev.data));      // raw PTY bytes
            }
        };
        ws.onclose = function () {
            _wsRetry = Math.min(_wsRetry + 1, 6);
            setTimeout(connectPty, 400 * _wsRetry);       // backoff reconnect
        };
        ws.onerror = function () { try { ws.close(); } catch (e) {} };
    }
    term.onData(function (data) { wsSend(data); });       // keystrokes → PTY

    function doFit() {
        try {
            fit.fit();
            if (ws && ws.readyState === 1) ws.send(JSON.stringify({ cols: term.cols, rows: term.rows }));
        } catch (e) {}
    }
    window.addEventListener('resize', doFit);
    new ResizeObserver(doFit).observe(document.getElementById('term'));

    function _ptyCtl(msg) {
        if (ws && ws.readyState === 1) {
            ws.send(JSON.stringify(msg));
        }
    }

    var _userScrolledBlocks = false;

    function _pollBlocks() {
        var win = _activeWin();
        if (win === null || _currentView !== 'shell') return;
        _ptyCtl({ ctl: 'blocks', win: win });
    }

    function _renderBlocks(blocks) {
        var el = document.getElementById('block-view');
        if (!el) return;
        var atBottom = el.scrollHeight - el.scrollTop <= el.clientHeight + 20;
        el.innerHTML = '';
        (blocks || []).forEach(function (b) {
            var hasOut = b.out && b.out.trim();
            var card = document.createElement('div');
            card.className = 'block-card';

            var hdr = document.createElement('div');
            hdr.className = 'block-cmd' + (hasOut ? '' : ' block-cmd-empty');

            var prompt = document.createElement('span');
            prompt.className = 'block-prompt';
            prompt.textContent = '❯';
            hdr.appendChild(prompt);

            var cmdText = document.createElement('span');
            cmdText.className = 'block-cmd-text';
            cmdText.textContent = _stripAnsi(b.cmd || '');
            hdr.appendChild(cmdText);

            if (b.exit !== null && b.exit !== undefined) {
                var badge = document.createElement('span');
                badge.className = 'block-exit ' + (b.exit === 0 ? 'exit-ok' : 'exit-err');
                badge.textContent = String(b.exit);
                hdr.appendChild(badge);
            }

            card.appendChild(hdr);

            if (hasOut) {
                var pre = document.createElement('pre');
                pre.className = 'block-out';
                pre.textContent = _stripAnsi(b.out);
                card.appendChild(pre);
            }

            el.appendChild(card);
        });

        if (!_userScrolledBlocks || atBottom) el.scrollTop = el.scrollHeight;
    }

    function renderTabs(windows) {
        lastWindows = windows || [];
        Array.prototype.slice.call(tabsEl.querySelectorAll('.tab:not(.tab-add)'))
            .forEach(function (n) { n.remove(); });
        (windows || []).forEach(function (w) {
            // pty_ws uses {i, kind} shape; shell_ctl uses {index} shape.
            var idx = w.index !== undefined ? w.index : w.i;
            if (w.kind) _windowKinds[idx] = w.kind;
            var chip  = document.createElement('button');
            chip.className = 'tab' + (w.active ? ' active' : '');
            var label = document.createElement('span');
            label.textContent = (w.name || 'sh') + ' ' + idx;
            chip.appendChild(label);
            chip.addEventListener('click', function (e) {
                if (e.target.classList.contains('x')) return;
                guard(api('/select', { index: String(idx) }));
                setView(_winKind(idx));
            });
            if (windows.length > 1) {
                var x = document.createElement('span');
                x.className = 'x'; x.textContent = '×';
                x.addEventListener('click', function (e) {
                    e.stopPropagation();
                    if (confirm('Close session ' + idx + '?'))
                        guard(api('/kill', { index: String(idx) }));
                });
                chip.appendChild(x);
            }
            tabsEl.insertBefore(chip, addAres);
        });
    }

    function refresh() {
        return api('/windows').then(function (d) { renderTabs(d.windows); })
                              .catch(function () {});
    }

    function guard(p) {
        if (busy) return;
        busy = true;
        p.then(function (d) { if (d && d.windows) renderTabs(d.windows); else refresh(); })
         .catch(function () {})
         .finally(function () { busy = false; });
    }

    addAres.addEventListener('click', function () { guard(api('/new', { target: 'ares' })); });
    addZeus.addEventListener('click',function () { guard(api('/new', { target: 'hermes'})); });

    function nextTab() {
        if (lastWindows.length < 2) return;
        var i = lastWindows.findIndex(function (w) { return w.active; });
        var n = lastWindows[(Math.max(i, 0) + 1) % lastWindows.length];
        guard(api('/select', { index: String(n.index) }));
    }
    function closeTab() {
        var a = lastWindows.find(function (w) { return w.active; });
        if (a && confirm('Close this tab?'))
            guard(api('/kill', { index: String(a.index) }));
    }

    /* ── Keybar ─────────────────────────────────────────────────────── */
    document.getElementById('keys').addEventListener('click', function (e) {
        var btn = e.target.closest('.key');
        if (!btn) return;
        if (btn.id === 'kbd-toggle') {
            // ponytail: focus/blur xterm textarea to show/hide soft keyboard
            var xtArea = document.querySelector('#term textarea');
            if (xtArea) { if (document.activeElement === xtArea) xtArea.blur(); else xtArea.focus(); }
            return;
        }
        if (btn.dataset.tab === 'new')   { guard(api('/new', { target: 'ares' })); return; }
        if (btn.dataset.tab === 'next')  { nextTab(); return; }
        if (btn.dataset.tab === 'close') { closeTab(); return; }
        if (btn.dataset.key)    api('/key',    { key: btn.dataset.key }).catch(function(){});
        if (btn.dataset.scroll) api('/scroll', { dir: btn.dataset.scroll }).catch(function(){});
    });

    /* ── Copy pane button ───────────────────────────────────────────── */
    var copyBtn = document.getElementById('kbd-copy');
    if (copyBtn) {
        copyBtn.addEventListener('click', function () {
            api('/capture').then(function (d) {
                var text = (d.text || '').trim();
                if (!text) return;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(function () {
                        copyBtn.textContent = '✓';
                        setTimeout(function () { copyBtn.textContent = 'copy'; }, 1200);
                    }).catch(function () {
                        prompt('Pane content (select all, copy):', text);
                    });
                } else {
                    prompt('Pane content (select all, copy):', text);
                }
            }).catch(function () {});
        });
    }

    /* ── Image paste → upload → inject path ─────────────────────────── */
    // Works in the page (not inside the cross-origin iframe). User pastes
    // an image anywhere on the terminal page; we upload it to _scratch and
    // inject the host path into the terminal for Claude Code to read.
    document.addEventListener('paste', function (e) {
        var items = (e.clipboardData || {}).items || [];
        var imgItem = null;
        for (var i = 0; i < items.length; i++) {
            if (items[i].type.indexOf('image/') === 0) { imgItem = items[i]; break; }
        }
        if (!imgItem) return;
        e.preventDefault();
        var file = imgItem.getAsFile();
        if (!file) return;
        var fd = new FormData();
        fd.append('file', file, 'paste.png');
        fetch(DASH + '/api/scratch-upload', { method: 'POST', body: fd })
            .then(function (r) { return r.json(); })
            .then(function (d) {
                if (d.path) {
                    api('/text', { text: d.path, enter: false }).catch(function(){});
                    _showBanner('Image saved → ' + d.path);
                }
            })
            .catch(function () { _showBanner('Image upload failed', true); });
    });

    function _showBanner(msg, err) {
        var b = document.getElementById('img-banner');
        if (!b) return;
        b.textContent = msg;
        b.style.background = err ? 'rgba(239,68,68,0.9)' : 'rgba(239,68,68,0.78)';
        b.style.opacity = '1';
        setTimeout(function () { b.style.opacity = '0'; }, 2800);
    }

    /* ── Poll tabs ──────────────────────────────────────────────────── */
    connectPty();
    setView('raw');
    refresh();
    setInterval(refresh, 3000);

    // Track manual upward scroll so auto-scroll doesn't fight the user.
    document.getElementById('block-view').addEventListener('scroll', function () {
        var el = this;
        _userScrolledBlocks = el.scrollHeight - el.scrollTop > el.clientHeight + 40;
    });

    var _claudeEvents = [];
    var _userScrolledClaude = false;

    function _pollClaudelog() {
        var win = _activeWin();
        if (win === null || _currentView !== 'claude') return;
        _ptyCtl({ ctl: 'claudelog', src: 'ares', win: win });
    }

    function _renderClaudelog(data) {
        var el = document.getElementById('claude-view');
        if (!el) return;
        var atBottom = el.scrollHeight - el.scrollTop <= el.clientHeight + 20;

        if (data.reset) {
            _claudeEvents = [];
            el.innerHTML = '';
        }

        if (data.waiting) {
            el.innerHTML = '<div class="claude-waiting">Waiting for Claude…</div>';
            return;
        }

        if (data.events && data.events.length) {
            _claudeEvents = _claudeEvents.concat(data.events);
            _rebuildClaudeView(el);
        }

        if (!_userScrolledClaude || atBottom) el.scrollTop = el.scrollHeight;
    }

    function _rebuildClaudeView(el) {
        el.innerHTML = '';
        _claudeEvents.forEach(function (ev) {
            var div = document.createElement('div');
            if (ev.role === 'user') {
                div.className = 'claude-user';
                div.innerHTML =
                    '<div class="claude-role">YOU</div>' +
                    '<div class="claude-text">' + _escHtml(ev.text || '') + '</div>';
            } else if (ev.role === 'assistant') {
                var txt = (ev.text || '');
                var truncated = txt.length > 2000;
                div.className = 'claude-assistant';
                div.innerHTML =
                    '<div class="claude-role">CLAUDE</div>' +
                    '<div class="claude-text">' +
                    _escHtml(truncated ? txt.slice(0, 2000) + '…' : txt) +
                    '</div>';
            } else if (ev.role === 'tool') {
                div.className = 'claude-tool';
                div.textContent = '[' + (ev.name || 'tool') + '] ' + (ev.detail || '');
            } else {
                return;
            }
            el.appendChild(div);
        });
    }

    document.getElementById('claude-view').addEventListener('scroll', function () {
        var el = this;
        _userScrolledClaude = el.scrollHeight - el.scrollTop > el.clientHeight + 40;
    });
})();
</script>
</body>
</html>
