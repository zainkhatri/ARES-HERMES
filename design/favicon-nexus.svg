<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6495ed" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6495ed"/>
      <stop offset="100%" stop-color="#6495ed" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" patternUnits="userSpaceOnUse" width="64" height="4">
      <rect width="64" height="1" fill="white" opacity="0.015"/>
    </pattern>
  </defs>

  <!-- bg -->
  <rect width="64" height="64" rx="8" fill="#04070d"/>
  <rect width="64" height="64" rx="8" fill="url(#scan)"/>

  <!-- corner brackets -->
  <g stroke="#6495ed" stroke-width="1.5" stroke-linecap="square" fill="none" opacity="0.2">
    <polyline points="5,16 5,5 16,5"/>
    <polyline points="48,5 59,5 59,16"/>
    <polyline points="59,48 59,59 48,59"/>
    <polyline points="16,59 5,59 5,48"/>
  </g>

  <!-- the N -->
  <g filter="url(#glow)" fill="#6495ed">
    <rect x="12" y="10" width="9" height="44"/>
    <rect x="43" y="10" width="9" height="44"/>
    <polygon points="12,10 21,10 52,54 43,54"/>
  </g>

  <!-- connection nodes -->
  <g fill="#6495ed" opacity="0.45">
    <circle cx="16.5" cy="10" r="1.5"/>
    <circle cx="47.5" cy="10" r="1.5"/>
    <circle cx="16.5" cy="54" r="1.5"/>
    <circle cx="47.5" cy="54" r="1.5"/>
  </g>

  <!-- bottom accent -->
  <rect x="10" y="60.5" width="44" height="1" rx="0.5" fill="url(#accent)" opacity="0.5"/>
</svg>
