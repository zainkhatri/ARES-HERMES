<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" patternUnits="userSpaceOnUse" width="64" height="4">
      <rect width="64" height="1" fill="white" opacity="0.015"/>
    </pattern>
  </defs>

  <!-- bg -->
  <rect width="64" height="64" rx="8" fill="#04070d"/>
  <rect width="64" height="64" rx="8" fill="url(#scan)"/>

  <!-- corner brackets -->
  <g stroke="#ef4444" stroke-width="1.5" stroke-linecap="square" fill="none" opacity="0.2">
    <polyline points="5,16 5,5 16,5"/>
    <polyline points="48,5 59,5 59,16"/>
    <polyline points="59,48 59,59 48,59"/>
    <polyline points="16,59 5,59 5,48"/>
  </g>

  <!-- the A -->
  <g filter="url(#glow)">
    <path fill-rule="evenodd" fill="#ef4444"
      d="M32 9 L11 55 L53 55 Z
         M32 22 L26 37 L38 37 Z
         M25 41 L39 41 L42 55 L22 55 Z"/>
  </g>

  <!-- vertex nodes -->
  <g fill="#ef4444" opacity="0.45">
    <circle cx="32" cy="9" r="1.5"/>
    <circle cx="11" cy="55" r="1.5"/>
    <circle cx="53" cy="55" r="1.5"/>
  </g>

  <!-- bottom accent -->
  <rect x="10" y="60.5" width="44" height="1" rx="0.5" fill="url(#accent)" opacity="0.5"/>
</svg>
